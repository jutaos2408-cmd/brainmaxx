<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lifemaxx</title>
<meta name="theme-color" content="#0B0C0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lifemaxx">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;900&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: Instrumententafel bei Nacht. Links feste Anzeige (Punktmatrix-Score, Aufschlüsselung, 14 Tage), rechts Log und Training. Bewusst nur dunkel. */
:root{
  --bg:#0B0C0E; --panel:#111215; --raise:#17181C; --line:#212328; --line2:#2E3138;
  --text:#E7E5E0; --dim:#8B8E97; --faint:#555962;
  --acc:#F0A73C; --good:#9FCBAA; --bad:#EA826F; --go:#3DDC84;
  --f-dot:"Doto", "Geist Mono", ui-monospace, monospace;
  --f-ui:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Geist Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(circle,#1A1C21 1px,transparent 1.3px);background-size:24px 24px;color:var(--text);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1.5px solid var(--acc);outline-offset:2px}
::selection{background:var(--acc);color:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:22px 110px}
.lab{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
code{font-family:var(--f-mono);font-size:.92em}

/* Kopfzeile */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px 24px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-dot);font-weight:900;font-size:30px;letter-spacing:.04em;line-height:1}
.brand h1 b{color:var(--acc);font-weight:900}
.datenav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.datenav .d{font-family:var(--f-mono);font-size:12.5px;padding:0 10px;white-space:nowrap}
.ib{width:30px;height:30px;border:1px solid var(--line2);border-radius:4px;color:var(--dim);font-family:var(--f-mono)}
.ib:hover:not(:disabled),.tb:hover:not(:disabled){color:var(--text);border-color:var(--faint)}
.ib:disabled,.tb:disabled{opacity:.3;cursor:default}
.tb{height:30px;padding:0 12px;border:1px solid var(--line2);border-radius:4px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:var(--dim);display:inline-flex;align-items:center;gap:6px}
.tb.acc{color:var(--acc);border-color:rgba(240,167,60,.45)}

.layout{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:36px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:26px}
.main{min-width:0}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr);gap:26px}.side{position:static}}

/* Score */
.scorebox{display:flex;flex-direction:column;gap:10px}
.bigrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.big{font-family:var(--f-dot);font-weight:900;font-size:104px;line-height:.82;letter-spacing:-.02em;font-variant-numeric:tabular-nums;transition:color .3s}
.grade{text-align:right;padding-bottom:4px}
.grade b{display:block;font-family:var(--f-dot);font-weight:900;font-size:30px;line-height:1}
.dots{display:flex;justify-content:space-between;gap:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line2);transition:background .25s,box-shadow .25s}
.tier{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tier .t{font-weight:600;font-size:15px}
.tier .r{color:var(--dim);font-size:12.5px;text-align:right}
.bd{display:flex;flex-direction:column;gap:9px}
.brow{display:grid;grid-template-columns:76px 1fr 34px;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11.5px;color:var(--dim)}
.brow .bar{position:relative;height:2px;background:var(--line)}
.brow .bar::before{content:"";position:absolute;left:50%;top:-4px;height:10px;width:1px;background:var(--line2)}
.brow .fill{position:absolute;top:0;bottom:0;transition:all .35s}
.brow .v{text-align:right;font-variant-numeric:tabular-nums}
.hist svg{display:block;width:100%;height:auto}
.hist .hb{cursor:pointer}
.hist .hb:hover{opacity:.75}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.stat .n{font-family:var(--f-dot);font-weight:900;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--f-mono);font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.sync{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.sync i{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.sync.ok i{background:var(--good)}

/* Tabs */
.tabs{display:flex;gap:2px;border:1px solid var(--line2);border-radius:5px;padding:2px;width:max-content;max-width:100%;margin-bottom:24px}
.tab{padding:7px 16px;border-radius:3px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--text);color:var(--bg)}

/* Upload */
.upl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;border:1px dashed var(--line2);border-radius:6px;padding:14px 16px;transition:border-color .15s,background .15s}
.upl.over{border-color:var(--acc);background:rgba(240,167,60,.05)}
.upl .t{flex:1 1 260px;min-width:0}
.upl .t b{display:block;font-weight:600;font-size:14px}
.upl .t span{color:var(--dim);font-size:12.5px}
.uplres{font-family:var(--f-mono);font-size:11.5px;color:var(--good);margin-top:8px;min-height:1em}
.uplres.err{color:var(--bad)}
.uplres.busy{color:var(--acc)}
.dropov{position:fixed;inset:0;z-index:30;background:rgba(11,12,14,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--acc);pointer-events:none}
.dropov b{font-family:var(--f-dot);font-weight:900;font-size:clamp(28px,6vw,48px);color:var(--acc)}

/* Log */
.sec{padding-block:20px;border-top:1px solid var(--line)}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sh h2{margin:0;font-size:15px;font-weight:600}
.sh h2 span{font-weight:400;color:var(--faint);margin-left:10px;font-size:13px}
.val{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--faint)}
.val.pos{color:var(--good)}.val.neg{color:var(--bad)}
.sec.rot h2{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:7px 11px;border:1px solid var(--line2);border-radius:4px;font-size:13.5px;line-height:1.25;text-align:left;transition:background .12s,border-color .12s,color .12s}
.chip:hover{border-color:var(--faint)}
.chip:active{transform:translateY(1px)}
.chip .p{font-family:var(--f-mono);font-size:11px;color:var(--good)}
.chip.neg .p{color:var(--bad)}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip[aria-pressed="true"] .p{color:var(--bg);opacity:.65}
.chip.neg[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.scales{display:flex;flex-direction:column;gap:10px}
.scale{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.scale .nm small{display:block;color:var(--faint);font-size:11.5px}
.seg{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.seg button{width:36px;height:30px;border:1px solid var(--line2);border-radius:4px;font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.seg button:hover{color:var(--text);border-color:var(--faint)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.seg .e{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);padding:0 4px}
.mx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
@media (max-width:560px){.mx{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mx label{display:flex;flex-direction:column;gap:5px;min-width:0}
.mx label span{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.mx input{height:38px;border:1px solid var(--line2);border-radius:4px;background:var(--panel);padding:0 10px;font-family:var(--f-dot);font-weight:900;font-size:19px;min-width:0;width:100%}
.mx input::placeholder{color:var(--faint);font-family:var(--f-mono);font-weight:400;font-size:12px}
.msrc{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);margin-top:10px}
.acts{margin-bottom:12px}
.act{display:grid;grid-template-columns:86px minmax(0,1fr) auto 24px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.act .ty{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.act .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .nm small{color:var(--faint);margin-left:8px;font-family:var(--f-mono);font-size:10.5px}
.act .num{font-family:var(--f-mono);font-size:12px;color:var(--dim);white-space:nowrap}
.act .x{color:var(--faint);font-size:16px}
.act .x:hover{color:var(--bad)}
.empty{color:var(--faint);font-size:13px;padding:6px 0 4px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.in{height:32px;border:1px solid var(--line2);border-radius:4px;background:var(--panel);padding:0 10px;min-width:0;font-size:13px}
.in[type=number]{width:84px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 15px;border-radius:4px;border:1px solid var(--line2);font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.solid:hover{background:#fff}
.btn.accent{background:var(--acc);border-color:var(--acc);color:var(--bg)}
details{margin-top:10px;font-size:13px;color:var(--dim)}
details summary{cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em}
details summary:hover{color:var(--text)}
details ul{margin:8px 0 0;padding-left:16px}
details li{margin-bottom:4px}
details b{color:var(--text);font-weight:500}
textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line2);border-radius:4px;background:var(--panel);padding:10px 12px;font-size:13.5px;line-height:1.55}
.foot{color:var(--faint);font-size:12px;max-width:68ch;margin-top:20px;line-height:1.6}

/* Training */
.tsum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tsum p{margin:0;color:var(--dim);font-size:13px;max-width:58ch}
.tsum .tot{font-family:var(--f-dot);font-weight:900;font-size:26px;line-height:1}
.tsum .tot small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--faint);margin-left:4px}
.daily-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.gridg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.gridg.daily{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.gridg.daily{grid-template-columns:minmax(0,1fr)}}
.game{background:var(--bg);padding:14px 15px 13px;text-align:left;display:flex;flex-direction:column;gap:7px;min-height:148px;transition:background .15s;position:relative}
.game:hover{background:var(--panel)}
.game .gc{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.game h3{margin:0;font-size:14.5px;font-weight:600}
.game .gd{color:var(--dim);font-size:12.5px;line-height:1.45;flex:1}
.game .gs{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-family:var(--f-mono);font-size:10px;color:var(--faint);letter-spacing:.06em}
.game .gs b{display:block;font-family:var(--f-dot);font-weight:900;font-size:20px;color:var(--text);letter-spacing:0;line-height:1.15}
.game .gs .rec{text-align:right}
.game .gs .rec b{color:var(--dim)}
.game.done::after{content:"";position:absolute;top:14px;right:14px;width:6px;height:6px;border-radius:50%;background:var(--good)}
.game.done .gc .val{margin-right:12px}
.filters{display:flex;gap:4px;overflow-x:auto;margin:22px 0 12px;padding-bottom:2px}
.filters button{white-space:nowrap;padding:6px 12px;border:1px solid var(--line2);border-radius:4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.filters button:hover{color:var(--text)}
.filters button[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}

.stage{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:18px;min-height:480px;display:flex;flex-direction:column}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;position:relative;z-index:2}
.stage-top .tl{font-weight:600}
.timebar{height:2px;background:var(--line2);margin-bottom:18px;overflow:hidden;position:relative;z-index:2}
.timebar i{display:block;height:100%;background:var(--acc);width:100%}
.sb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;z-index:2}
#noise{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#noise span{position:absolute;font-family:var(--f-dot);font-weight:900;line-height:1}
.gw{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}
.prompt{font-family:var(--f-dot);font-weight:900;font-size:clamp(40px,9vw,64px);line-height:1.05;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.prompt.sm{font-family:var(--f-mono);font-weight:500;font-size:clamp(19px,4.4vw,26px);letter-spacing:0}
.ansline{min-height:52px;min-width:160px;border-bottom:1px solid var(--line2);font-family:var(--f-dot);font-weight:900;font-size:40px;line-height:52px;font-variant-numeric:tabular-nums;transition:color .12s}
.ansline.ok{color:var(--good);border-color:var(--good)}
.ansline.no{color:var(--bad);border-color:var(--bad)}
.hud{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;font-family:var(--f-mono);font-size:11px;color:var(--dim);letter-spacing:.06em}
.hud b{color:var(--text);font-weight:500}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:6px}
.pad button{height:46px;border:1px solid var(--line2);border-radius:4px;font-family:var(--f-mono);font-size:17px;background:var(--bg)}
.pad button:hover{border-color:var(--faint)}
.pad button:active{background:var(--raise)}
.pad .ok{grid-column:1/-1;background:var(--text);color:var(--bg);border-color:var(--text);font-size:12px;letter-spacing:.12em}
.intro{max-width:46ch;color:var(--dim);font-size:13.5px;margin:0}
.intro b{color:var(--text);font-weight:500}
.qq{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%;min-width:0}
.qq .prompt{display:inline-block;transition:color .2s}
.qhint{font-family:var(--f-mono);font-size:11px;color:var(--dim);letter-spacing:.04em}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:min(100%,480px)}
.ch{position:relative;min-height:52px;padding:10px 14px;border:1px solid var(--line2);border-radius:4px;background:var(--bg);font-family:var(--f-mono);font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .1s,border-color .1s}
.ch:hover{border-color:var(--faint)}
.ch small{position:absolute;top:4px;left:7px;font-size:9px;color:var(--faint)}
.ch.right{background:var(--good);border-color:var(--good);color:var(--bg)}
.ch.wrong{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.ch.right small,.ch.wrong small{color:var(--bg)}
.choices.vg{gap:4px;width:min(100%,430px)}
.choices.vg .ch{aspect-ratio:1;min-height:0;padding:0;font-size:clamp(14px,3.6vw,22px);font-family:var(--f-ui)}
.choices.toks .ch{font-size:30px;min-height:64px;font-family:var(--f-ui)}
.code{font-family:var(--f-mono);font-size:14.5px;line-height:1.6;background:var(--bg);border:1px solid var(--line2);border-radius:5px;padding:14px 18px;text-align:left;white-space:pre;overflow-x:auto;max-width:100%;margin:0}
.code .bl{color:var(--acc);border-bottom:1.5px solid var(--acc);padding:0 4px}
.code .cm{color:var(--faint)}
.stroopw{font-family:var(--f-ui);font-weight:600;font-size:clamp(46px,11vw,76px);letter-spacing:.06em;line-height:1}
.seqq{font-family:var(--f-dot);font-weight:900;font-size:clamp(24px,5.6vw,40px);letter-spacing:.02em;line-height:1.2}
.seqrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:34px;line-height:1}
.matrix{display:grid;grid-template-columns:repeat(3,62px);gap:4px}
.matrix span{height:62px;border:1px solid var(--line2);border-radius:4px;display:grid;place-items:center;font-size:30px;background:var(--bg)}
.matrix span.qm{font-family:var(--f-dot);font-weight:900;color:var(--acc);border-style:dashed}
.logic{max-width:46ch;font-size:16px;line-height:1.55;text-align:left}
.logic b{color:var(--acc);font-weight:500}
.mg{display:grid;gap:5px;width:min(100%,340px)}
.mg button{aspect-ratio:1;border:1px solid var(--line2);border-radius:4px;background:var(--bg);transition:background .12s,border-color .12s}
.mg button.lit{background:var(--acc);border-color:var(--acc)}
.mg button.hit{background:var(--good);border-color:var(--good)}
.mg button.miss{background:var(--bad);border-color:var(--bad)}
.cb-hist{display:flex;flex-direction:column;width:min(100%,320px);max-height:210px;overflow:auto}
.cbr{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;font-family:var(--f-mono);padding:5px 8px;border-bottom:1px solid var(--line)}
.cbr .n{color:var(--faint);font-size:11px}
.cbr .g{font-family:var(--f-dot);font-weight:900;font-size:22px;letter-spacing:.25em;text-align:left}
.cbr .f{color:var(--acc);letter-spacing:.18em;font-size:14px}
.dual{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;width:100%;align-items:center}
@media (max-width:640px){.dual{grid-template-columns:minmax(0,1fr)}}
.dual > div{display:flex;flex-direction:column;align-items:center;gap:14px}
.cbox{width:130px;height:130px;border-radius:6px;border:1px solid var(--line2);background:var(--bg);transition:background .06s}
.gbtn{height:50px;padding:0 26px;font-family:var(--f-mono);letter-spacing:.12em;font-size:12.5px}
.gbtn small{opacity:.55;margin-left:8px;font-size:10px;letter-spacing:.04em}
.slots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.slots span{width:36px;height:46px;border-bottom:1.5px solid var(--line2);font-family:var(--f-dot);font-weight:900;font-size:28px;display:grid;place-items:center}
.slots.ok span{color:var(--good);border-color:var(--good)}
.slots.no span{color:var(--bad);border-color:var(--bad)}
.tiles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:480px}

.winput.no{border-color:var(--bad)}
.arena{position:relative;width:100%;height:min(58vh,400px);border:1px solid var(--line2);border-radius:5px;background:var(--bg);overflow:hidden;touch-action:manipulation;cursor:crosshair}

.react{width:100%;flex:1;min-height:300px;border-radius:5px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer}

.grid5 button{aspect-ratio:1;border:1px solid var(--line2);border-radius:4px;background:var(--bg);font-family:var(--f-dot);font-weight:900;font-size:clamp(18px,5vw,26px)}

.nb{min-height:140px;display:grid;place-items:center}
.nbl{font-size:clamp(70px,15vw,120px)}
.timebig{font-family:var(--f-dot);font-weight:900;font-size:clamp(54px,12vw,92px);line-height:1}
.result .prompt{color:var(--acc)}
.result .sub{color:var(--dim);font-size:13px;max-width:46ch}
.result .pts{font-family:var(--f-mono);font-size:12px;color:var(--good)}


.shotcard{border:1px solid var(--acc);border-radius:6px;padding:14px 16px;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.sr{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}

@media (max-width:520px){.sr{grid-template-columns:70px minmax(0,1fr)}.sr .mono{grid-column:2}}
/* Seitenleiste Level */
.sidelvl{display:flex;flex-direction:column;gap:7px}
.lvrow{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--dim)}
.lvrow b{color:var(--text);font-weight:500}
.xpbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}

/* Daily */
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px 24px;flex-wrap:wrap;margin-bottom:16px}
.dayno{font-family:var(--f-dot);font-weight:900;font-size:clamp(56px,10vw,84px);line-height:.9;letter-spacing:.02em}
.dstat{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-family:var(--f-mono);font-size:11px;color:var(--dim);letter-spacing:.05em;text-align:right}
.dstat b{color:var(--text);font-weight:500}
.dtot{font-family:var(--f-dot);font-weight:900;font-size:34px;color:var(--acc);line-height:1}

.dstat .up{color:var(--good)}.dstat .down{color:var(--bad)}
.eventbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;color:var(--dim);margin-bottom:16px}
.eventbar b{color:var(--acc);font-weight:600}
.eventbar .cd{font-family:var(--f-mono);font-size:11px;color:var(--text)}
.eventbar .sep{flex-basis:100%;height:0}
.workout{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.wrow{display:grid;grid-template-columns:96px minmax(0,1fr) 70px 110px;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);text-align:left;background:var(--bg);transition:background .15s}
.wrow:first-child{border-top:0}
.wrow:hover{background:var(--panel)}
.wrow .wl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--acc)}
.wrow .wn{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .wd{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.wrow .wx{font-family:var(--f-mono);font-size:12px;color:var(--faint);text-align:right}

.wkrow{margin:14px 0 22px;gap:14px}
.btn.big{height:46px;padding:0 26px;font-size:14px}

.chal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:6px}
@media (max-width:640px){.chal{grid-template-columns:minmax(0,1fr)}}
.ch-card{border:1px solid var(--line2);border-radius:6px;padding:13px 14px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}

.ch-card .rw{font-family:var(--f-mono);font-size:11px;color:var(--acc)}
.ch-card.ok{border-color:rgba(159,203,170,.4)}
.ch-card.ok .rw{color:var(--good)}
.pbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--acc)}
.ch-card.ok .pbar i{background:var(--good)}
.plans{display:flex;flex-wrap:wrap;gap:6px}
.plhead{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-bottom:12px}
.plhead span{font-family:var(--f-mono);font-size:11px;color:var(--dim);flex:1}
.pldots{display:flex;gap:6px;margin-bottom:12px}
.pldots span{width:34px;height:34px;border:1px solid var(--line2);border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.pldots span.ok{background:var(--good);border-color:var(--good);color:var(--bg)}
.pldots span.now{border-color:var(--acc);color:var(--acc)}
.pldots span.miss{border-style:dashed}
.plgames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (max-width:560px){.plgames{grid-template-columns:minmax(0,1fr)}}
.pg{border:1px solid var(--line2);border-radius:5px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;font-weight:500}
.pg:hover{border-color:var(--faint)}
.pg.done{border-color:var(--good);color:var(--good)}
/* Training */
.diffrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:4px}
.diffrow .hint{flex-basis:100%}
.qbar{width:min(100%,480px);height:2px;background:var(--line2);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--bad);animation:qb linear forwards}
@keyframes qb{from{width:100%}to{width:0}}
.ex{max-width:520px;width:100%;border-left:2px solid var(--acc);background:var(--bg);padding:10px 14px;text-align:left;font-size:13.5px;line-height:1.5;color:var(--text);display:flex;flex-direction:column;gap:6px}
.ex b{color:var(--acc);font-weight:600}
.boosts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.boosts span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;padding:3px 8px;border:1px solid var(--line2);border-radius:3px;color:var(--dim)}
.xpgain{font-family:var(--f-dot);font-weight:900;font-size:28px;color:var(--good)}
.lvup{font-family:var(--f-dot);font-weight:900;font-size:24px;color:var(--acc);letter-spacing:.04em}
.badge-new{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--acc)}
.badge-new b{font-family:var(--f-dot);font-weight:900;font-size:16px;width:38px;height:38px;border:1px solid var(--acc);border-radius:50%;display:grid;place-items:center}
.review{width:min(100%,560px);text-align:left;margin-top:6px}
.review summary{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--dim);cursor:pointer;margin-bottom:6px}
.rv{border-top:1px solid var(--line);padding:9px 0;display:flex;flex-direction:column;gap:3px}
.rq{font-size:13px;color:var(--dim);overflow-wrap:anywhere}
.ra{font-family:var(--f-mono);font-size:13px}
.ra .no{color:var(--bad);text-decoration:line-through}
.ra .ok{color:var(--good)}
.re{font-size:12.5px;color:var(--text)}
.rsvp{display:grid;grid-template-columns:1fr auto 1fr;width:min(100%,520px);font-family:var(--f-ui);font-size:clamp(30px,7vw,46px);font-weight:500;padding:26px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);position:relative}
.rsvp::before,.rsvp::after{content:"";position:absolute;left:50%;width:1px;height:10px;background:var(--acc)}
.rsvp::before{top:0}.rsvp::after{bottom:0}
.rsvp .l{text-align:right;white-space:pre}.rsvp .c{color:var(--acc)}.rsvp .r{text-align:left;white-space:pre}
/* Profil */
.ptop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;margin-bottom:6px}
@media (max-width:720px){.ptop{grid-template-columns:minmax(0,1fr)}}
.bsbox{display:flex;flex-direction:column;gap:4px}
.bsnum{font-family:var(--f-dot);font-weight:900;font-size:clamp(64px,11vw,96px);line-height:.9;color:var(--acc)}
#radar svg{width:100%;max-width:320px;height:auto;display:block;margin-top:6px}
.lvbox{display:flex;flex-direction:column;gap:8px}
.lvbig{font-family:var(--f-dot);font-weight:900;font-size:64px;line-height:.9}
.lvbig small{font-family:var(--f-ui);font-weight:500;font-size:15px;margin-left:12px;color:var(--dim)}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 12px;margin-top:10px}
.tgrid div{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:7px;min-width:0}
.tgrid b{font-family:var(--f-dot);font-weight:900;font-size:20px;line-height:1.1}
.tgrid span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;color:var(--dim)}
.tree{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media (max-width:760px){.tree{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.th{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.th b{font-family:var(--f-ui);font-size:14px;color:var(--text);font-weight:600}
.nodes{display:flex;flex-direction:column;gap:0;position:relative;padding-left:4px}
.node{display:grid;grid-template-columns:14px 1fr;grid-template-rows:auto auto;column-gap:10px;padding:5px 0;position:relative}
.node i{grid-row:1/3;width:10px;height:10px;border-radius:50%;border:1px solid var(--line2);background:var(--bg);margin-top:4px;position:relative;z-index:1}
.node:not(:last-child)::before{content:"";position:absolute;left:4.5px;top:16px;bottom:-6px;width:1px;background:var(--line2)}
.node span{font-size:13px;color:var(--faint)}
.node small{font-family:var(--f-mono);font-size:9.5px;color:var(--faint)}
.node.on i{background:var(--acc);border-color:var(--acc);box-shadow:0 0 6px rgba(240,167,60,.5)}
.node.on span{color:var(--text)}
.node.on:not(:last-child)::before{background:var(--acc)}
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:760px){.charts{grid-template-columns:minmax(0,1fr)}}
.charts svg{width:100%;height:auto;display:block;margin-top:6px}
.pbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}
@media (max-width:640px){.pbs{grid-template-columns:minmax(0,1fr)}}
.pbr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;padding:8px 0;border-bottom:1px solid var(--line);column-gap:10px}
.pbr .nm{font-size:13.5px}

.pbr .v small{font-family:var(--f-mono);font-weight:400;font-size:10px;color:var(--dim)}
.pbr .dt{font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.pbr.none .nm,.pbr.none .v{color:var(--faint)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ac{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:4px;opacity:.55}
.ac b{font-family:var(--f-dot);font-weight:900;font-size:20px;width:46px;height:46px;border:1px dashed var(--line2);border-radius:50%;display:grid;place-items:center;color:var(--faint);margin-bottom:4px}
.ac .an{font-size:13px;font-weight:600}
.ac .ad{font-size:11.5px;color:var(--dim)}
.ac.ok{opacity:1;border-color:var(--line2)}
.ac.ok b{border:1px solid var(--acc);color:var(--acc);box-shadow:0 0 10px rgba(240,167,60,.18)}
.lb{display:flex;flex-direction:column}
.lbr{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.lbr .rk{font-family:var(--f-dot);font-weight:900;font-size:18px;color:var(--faint)}
.lbr:first-child .rk{color:var(--acc)}
.lbr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr .lv{font-family:var(--f-mono);font-size:10.5px;color:var(--dim)}
.lbr .xp{font-family:var(--f-mono);font-size:12.5px;text-align:right}
.lbr.me .nm{color:var(--acc);font-weight:600}
.lb .hint{margin:10px 0 0}
.fab{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(11,12,14,.94);border-top:1px solid var(--line);z-index:5;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.fab .s{font-family:var(--f-dot);font-weight:900;font-size:28px;line-height:1}
.fab .t{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
@media (max-width:900px){.fab{display:flex}}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px;z-index:40;max-width:calc(100% - 40px);text-align:center}
@media (prefers-reduced-motion:reduce){.big,.dots i,.brow .fill,.chip,.ch,.mg button{transition:none}}

<style>
/* Life-Score-App: eine Spalte, Tab-Leiste unten wie eine native App. Bereiche klappen auf, damit die Startseite ruhig bleibt. */
html{-webkit-text-size-adjust:100%;color-scheme:dark;background:#0B0C0E}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;overscroll-behavior-y:none;font-size:15px;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.app{max-width:640px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 14px;border-bottom:0;margin-bottom:0;flex-wrap:nowrap}
.brand{font-family:var(--f-dot);font-weight:900;font-size:24px;letter-spacing:.04em;line-height:1}
.brand b{color:var(--acc)}
.chips2{display:flex;gap:6px;align-items:center}
.chipx{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--dim);border:1px solid var(--line2);border-radius:20px;padding:5px 10px;background:none}
.chipx b{color:var(--text);font-weight:500}
#ftChip{color:var(--acc);border-color:rgba(240,167,60,.5)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(11,12,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar>div{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;max-width:640px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.tabbar button[aria-current="page"]{color:var(--text)}
.tabbar button[aria-current="page"] svg{stroke:var(--acc)}
body.instage .tabbar{display:none}
.view{display:flex;flex-direction:column;gap:14px}

.ib{width:34px;height:34px;border:1px solid var(--line2);border-radius:6px;color:var(--dim);font-family:var(--f-mono);font-size:16px}
.ib:disabled{opacity:.3}
.dnav{display:flex;align-items:center;gap:8px}
.dnav span{flex:1;text-align:center;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:4px}
.bignum{font-family:var(--f-dot);font-weight:900;font-size:112px;line-height:.82;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hr{text-align:right;display:flex;flex-direction:column;gap:3px;padding-bottom:4px;min-width:0}
.tn{font-weight:600;font-size:17px}
.trm{color:var(--dim);font-size:13px}
.rk{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--acc)}
.dots{display:flex;justify-content:space-between;gap:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line2)}
.cov{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--faint)}
.warn{border:1px solid var(--bad);border-radius:8px;padding:11px 13px;font-size:13.5px;color:var(--text);background:rgba(234,130,111,.07)}
.warn b{color:var(--bad)}

.cats{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cat{border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.crow{width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto 18px;grid-template-areas:"d n s c" "b b b b" "m m m m";column-gap:10px;row-gap:7px;padding:14px 14px 13px;text-align:left;background:var(--bg)}
.cat.open .crow{background:var(--panel)}
.crow .cd{grid-area:d;width:8px;height:8px;border-radius:50%;align-self:center}
.crow .cn{grid-area:n;font-weight:600;font-size:15px}
.crow .cs{grid-area:s;font-family:var(--f-dot);font-weight:900;font-size:24px;line-height:1}
.crow .chev{grid-area:c;color:var(--faint);font-family:var(--f-mono);text-align:right;align-self:center}
.crow .pb{grid-area:b}
.crow .csum{grid-area:m;font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel{padding:4px 14px 16px;background:var(--panel);display:flex;flex-direction:column;gap:12px}
.pb{height:4px;background:var(--line);border-radius:3px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .35s}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 12px}
@media (max-width:380px){.grid2{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl{display:flex;flex-direction:column;gap:1px}
.fl span{font-size:13px;font-weight:500}
.fl small{font-size:11px;color:var(--faint)}
.stp{display:grid;grid-template-columns:38px minmax(0,1fr) auto 38px;align-items:center;border:1px solid var(--line2);border-radius:8px;background:var(--bg);height:42px;overflow:hidden}
.stp button{height:100%;font-size:20px;color:var(--dim)}
.stp button:active{background:var(--raise);color:var(--text)}
.stp .sv{width:100%;min-width:0;border:0;background:none;text-align:right;font-family:var(--f-dot);font-weight:900;font-size:20px;padding:0 4px;outline:none}
.stp .sv::placeholder{color:var(--faint)}
.stp .su{font-family:var(--f-mono);font-size:10px;color:var(--faint);padding-right:4px}
.in{height:40px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);padding:0 11px;font-size:15px;min-width:0}
.in.wide{width:100%}
.in.sm{width:72px}
.in.time{width:100%;font-family:var(--f-dot);font-weight:900;font-size:20px;color:var(--text)}
textarea.in{height:auto;padding:10px 12px;line-height:1.5;width:100%;resize:vertical}
select.in{padding-right:6px}
.tri,.seg{display:flex;gap:4px}
.tri button,.seg button{flex:1;width:auto;height:38px;border:1px solid var(--line2);border-radius:8px;font-size:13px;color:var(--dim)}
.tri button[aria-pressed="true"]:first-child,.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.tri button[aria-pressed="true"]:last-child{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.seg.wide button{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em}
.tog{height:38px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;font-size:13px;color:var(--dim)}
.tog[aria-pressed="true"]{border-color:var(--good);color:var(--good)}
.prog{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim)}
.pl b{color:var(--text);font-weight:500;font-family:var(--f-mono);font-size:12px}
.kvs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv{display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--line);padding-top:7px;min-width:0}
.kv span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.kv b{font-family:var(--f-dot);font-weight:900;font-size:22px;line-height:1.15}
.kv small{font-size:11px;color:var(--faint);overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.c{justify-content:center}
.btn{height:40px;border-radius:8px}
.btn.big{height:48px;padding:0 22px;font-size:14.5px}
.btn.wide{width:100%}
.lnk{color:var(--faint);font-size:12.5px;text-decoration:underline;margin-top:4px}
.note{border-left:2px solid var(--acc);padding:6px 10px;font-size:13px;color:var(--dim);background:var(--bg)}
.note b{color:var(--text)}
.note.bad{border-color:var(--bad)}
.note.good{border-color:var(--good)}
.hint{font-size:12px;color:var(--faint);margin:0}
.sub2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:2px}
.addrow{display:flex;gap:6px}
.addrow .wide{flex:1}
.addrow .btn{width:44px;padding:0;flex:none}
.acts{display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:80px minmax(0,1fr) auto 26px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.act .ty{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);overflow:hidden;text-overflow:ellipsis}
.act .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .nm small{color:var(--faint);margin-left:6px;font-family:var(--f-mono);font-size:10px}
.act .num{font-family:var(--f-mono);font-size:12px;color:var(--dim);white-space:nowrap}
.x{color:var(--faint);font-size:18px;width:26px;height:26px}
.sleepbig{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sleepbig b{font-family:var(--f-dot);font-weight:900;font-size:40px;line-height:1}
.sleepbig span{font-size:12.5px;color:var(--dim)}
.chart{width:100%;height:auto;display:block}
details.more summary{cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--dim);padding:4px 0}
details.more[open] summary{margin-bottom:10px}
details.more ul{padding-left:18px;line-height:1.55}
.detox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line2);border-radius:8px;padding:12px}
.detox b{font-weight:500;font-size:14px}
.pldots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pldots span{height:32px;border:1px solid var(--line2);border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.pldots span.ok{background:var(--good);border-color:var(--good);color:var(--bg)}
.pldots span.fail{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.pldots span.now{border-color:var(--acc);color:var(--acc)}
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:30px minmax(0,1fr) 30px 30px 26px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.tk{width:26px;height:26px;border:1.5px solid var(--line2);border-radius:50%;color:var(--bg);font-size:14px;font-weight:700}
.task.done .tk{background:var(--good);border-color:var(--good)}
.task.done .tt{color:var(--faint);text-decoration:line-through}
.tt{font-size:14px;overflow-wrap:anywhere}
.tp{width:28px;height:26px;border-radius:5px;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line2);color:var(--dim)}
.tp.p3{border-color:var(--bad);color:var(--bad)}
.tp.p2{border-color:var(--acc);color:var(--acc)}
.tst{font-size:16px;color:var(--line2)}
.tst.on{color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 11px;font-size:13px}
.blk{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bh h2{margin:0;font-size:16px;font-weight:600}
.quest{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qc{width:22px;height:22px;border:1.5px solid var(--line2);border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--bg)}
.quest.ok .qc{background:var(--good);border-color:var(--good)}
.quest.ok .qt{color:var(--dim)}
.qt{font-size:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.qp{display:flex;flex-direction:column;gap:3px}
.qp small{font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.qx{font-family:var(--f-mono);font-size:11px;color:var(--acc);white-space:nowrap}
.quest.ok .qx{color:var(--good)}

/* Modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-bottom:0;border-radius:16px 16px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .bignum{font-size:96px}
.kvs:has(> :nth-child(3):last-child){grid-template-columns:repeat(3,minmax(0,1fr))}
.sbars{display:flex;flex-direction:column;gap:8px}
.sbr{display:grid;grid-template-columns:64px minmax(0,1fr) 32px;gap:10px;align-items:center;font-size:12.5px;color:var(--dim)}
.sbr b{font-family:var(--f-mono);font-weight:500;color:var(--text);text-align:right}

/* Fokus */
.ftbox{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:22px 16px}
.fttime{font-family:var(--f-dot);font-weight:900;font-size:clamp(76px,24vw,120px);line-height:.9;font-variant-numeric:tabular-nums;color:var(--acc)}
.fttime.idle{color:var(--text)}
.ftbox .pb{width:100%}
.ftbox .seg{width:100%}
.ck{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);white-space:nowrap}

/* Spiele */
.workout{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wrow{display:grid;grid-template-columns:86px minmax(0,1fr) 60px 24px;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);text-align:left;background:var(--bg)}
.wrow:first-child{border-top:0}
.wrow .wl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--acc)}
.wrow .wn{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .wd{font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.wrow .wx{color:var(--good);text-align:right}
.wrow.done .wn{color:var(--dim)}
.diffrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.filters{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin:0}
.gridg{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:400px){.gridg{grid-template-columns:minmax(0,1fr)}}
.game{min-height:140px}
.game h3{font-size:14px}

/* Spielbühne als Vollbild */
.stage{position:fixed;inset:0;z-index:30;border:0;border-radius:0;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));min-height:0}
.stage .stage-top{max-width:640px;margin:0 auto 14px;width:100%}
.stage .timebar{max-width:640px;margin:0 auto 18px;width:100%}
.stage .sb{max-width:640px;margin:0 auto;width:100%;min-height:calc(100vh - 140px)}

/* Stats */
.calh{display:flex;align-items:center;justify-content:space-between}
.calh b{font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cwd{font-family:var(--f-mono);font-size:10px;color:var(--faint);text-align:center;padding-bottom:2px}
.cday{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--dim);background:var(--bg)}
.cday small{font-family:var(--f-mono);font-size:9.5px;opacity:.85}
.cday.now{outline:1.5px solid var(--acc);outline-offset:1px}
.cday.fut{opacity:.35}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.pbs{display:flex;flex-direction:column}


/* Heute: Ringe, Check-ins, Als Nächstes */
.rings{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:4px}
.rg{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:10px}
.rg:active{background:var(--panel)}
.rg svg{display:block}
.rg b{position:absolute;top:6px;height:56px;display:grid;place-items:center;font-family:var(--f-dot);font-weight:900;font-size:19px;line-height:1}
.rg span{font-size:11.5px;color:var(--dim)}
.cis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ci{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;border:1px solid var(--line2);border-radius:10px;padding:11px 12px;background:var(--bg)}
.ci span{grid-row:1/3;font-size:20px;color:var(--acc)}
.ci b{font-weight:600;font-size:13.5px}
.ci small{font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.ci.done{border-color:rgba(159,203,170,.45)}
.ci.done span,.ci.done small{color:var(--good)}
.next{border-left:2px solid var(--acc);background:var(--panel);border-radius:0 10px 10px 0;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.next p{margin:0;font-size:14.5px;line-height:1.45}
.next b{color:var(--acc);font-weight:600}
.next .btn{height:36px}
/* Sheets */
.shh{display:grid;grid-template-columns:auto minmax(0,1fr) auto 32px;align-items:center;gap:10px;position:sticky;top:-20px;background:var(--panel);padding:4px 0 8px;z-index:2}
.shh .cd{width:9px;height:9px;border-radius:50%}
.shh b{font-size:18px;font-weight:600}
.shs{font-family:var(--f-dot);font-weight:900;font-size:26px;line-height:1}
.shh .x{font-size:24px;width:32px;height:32px}
.shb{display:flex;flex-direction:column;gap:12px}
.cidots{display:flex;gap:4px}
.cidots i{flex:1;height:3px;border-radius:2px;background:var(--line2)}
.cidots i.on{background:var(--acc)}
.cit{margin:6px 0 0;font-size:21px;font-weight:600;letter-spacing:-.01em}
.cinav{justify-content:flex-end;margin-top:6px}
.cinav .btn.big{min-width:140px}
.feel button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:52px}
.feel button b{font-family:var(--f-dot);font-weight:900;font-size:18px}
.feel button small{font-size:10px;opacity:.75}
.bedby{height:40px;display:flex;align-items:center;font-family:var(--f-dot);font-weight:900;font-size:24px;color:var(--acc)}
.tog.sm{height:32px;padding:0 12px;font-size:12.5px}
/* Klappbereiche */
.fold{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.fold summary{font-family:var(--f-ui);letter-spacing:0;color:var(--text);list-style:none;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;cursor:pointer;font-weight:600;font-size:14.5px}
.fold summary::-webkit-details-marker{display:none}
.fold summary i{font-style:normal;color:var(--faint);transition:transform .2s;font-family:var(--f-mono)}
.fold[open] summary i{transform:rotate(90deg)}
.foldin{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.shb .fold,.foldin .fold{background:var(--bg)}
/* Spiele-Liste */
.glist{display:flex;flex-direction:column}
.gi2{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left}
.gi2 .gn{display:flex;flex-direction:column;gap:2px;min-width:0}
.gi2 .gn b{font-weight:500;font-size:14px}
.gi2 .gn small{font-family:var(--f-mono);font-size:10px;color:var(--faint);letter-spacing:.04em}
.gi2 .gv{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.gi2 .gv b{font-family:var(--f-dot);font-weight:900;font-size:18px}
.gi2 .gv small{font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.gi2.done .gn b{color:var(--good)}
.wrow{grid-template-columns:86px minmax(0,1fr) auto!important}
.wrow .wx{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.wrow.done .wx{color:var(--good)}
/* Verlauf */
.wk{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;align-items:center}
.wka{display:flex;flex-direction:column;gap:2px}
.wka b{font-family:var(--f-dot);font-weight:900;font-size:58px;line-height:.95}
.wka small{font-size:11.5px;color:var(--faint)}
.wka i,.wkr i{font-style:normal;font-family:var(--f-mono);font-size:11px}
.up{color:var(--good)}.dn{color:var(--bad)}
.wkc{display:flex;flex-direction:column;gap:7px}
.wkr{display:grid;grid-template-columns:8px minmax(0,1fr) 28px 40px;gap:8px;align-items:center;font-size:13px}
.wkr .cd{width:7px;height:7px;border-radius:50%}
.wkr b{font-family:var(--f-mono);font-weight:500;text-align:right}
.ins{border-left:2px solid var(--good);padding:8px 12px;font-size:14px;line-height:1.5;background:var(--panel);border-radius:0 8px 8px 0}
.ins b{color:var(--good);font-weight:600}
.jr{display:flex;flex-direction:column;gap:3px;padding:8px 0;border-bottom:1px solid var(--line)}
.jr p{margin:0;font-size:14px;line-height:1.45}
.jr small{font-size:12px;color:var(--dim)}
.fttime.brk{color:var(--good)}
.streaks{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:420px){.streaks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stk{padding:10px}
.stk b{font-size:30px}

/* Profil */
.lvbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:16px}
.lvbig{font-family:var(--f-dot);font-weight:900;font-size:76px;line-height:.9}
.lvbig small{font-family:var(--f-ui);font-weight:500;font-size:14px;color:var(--dim);margin-left:10px}
.streaks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stk{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stk b{font-family:var(--f-dot);font-weight:900;font-size:34px;line-height:1;color:var(--acc)}
.stk span{font-weight:600;font-size:13.5px}
.stk small{font-size:11px;color:var(--faint)}
.ach{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.goals{display:flex;flex-direction:column}
.gl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.gl.col{flex-direction:column;align-items:stretch;border:0;gap:6px}
.gl.col span{font-size:13px;color:var(--dim)}
.gi{display:flex;align-items:center;gap:6px}
.gi .in{width:96px;text-align:right;font-family:var(--f-mono)}
.gi small{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);width:56px}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50}

/* ---- Quests & Menüs ---- */
.mq{display:flex;flex-direction:column;gap:9px;border:1px solid var(--line2);border-left:2px solid var(--acc);border-radius:4px 12px 12px 4px;background:var(--panel);padding:13px 14px;text-align:left;width:100%}
.mq.full{gap:12px;padding:16px}
.mq.empty{border-style:dashed;border-left:2px solid var(--acc);align-items:flex-start}
.mq.empty b{font-size:16px;font-weight:600}
.mq.empty small{color:var(--faint);font-size:12px}
.mqh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left}
.mqh .lab{color:var(--acc)}
.mqh .val{font-family:var(--f-mono);font-size:11.5px;color:var(--dim)}
.mqt{font-size:17px;font-weight:600;line-height:1.3;text-align:left;color:var(--text);letter-spacing:-.01em}
.mq.full .mqt{font-size:21px}
.why{margin:0;color:var(--dim);font-size:13.5px;line-height:1.45}
.mqs{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border-top:1px solid var(--line);padding-top:9px;font-size:14px;width:100%}
.mqs small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;color:var(--faint);margin-bottom:2px}
.tk{display:grid;place-items:center;flex:none}
.tk.on{background:var(--good);border-color:var(--good)}
.steps{display:flex;flex-direction:column}

<script>
(function(){
"use strict";
/* ================= Helfer ================= */
const $=s=>document.querySelector(s);
const pad2=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const toDate=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=toDate(k);d.setDate(d.getDate()+n);return keyOf(d)};
const today=()=>keyOf(new Date());
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const minus=s=>String(s).replace(/-/g,'−');
const nf=n=>Math.round(n).toLocaleString('de-DE');
const fmtMin=m=>m==null?'–':Math.floor(m/60)+':'+pad2(Math.round(m%60));
const fmtDur=m=>m==null?'–':m<60?Math.round(m)+' min':fmtMin(m)+' h';
const tmin=t=>{if(typeof t!=='string'||!/^\d{1,2}:\d{2}$/.test(t))return null;const[h,m]=t.split(':').map(Number);return h*60+m};
const fmtClock=m=>m==null?'–':pad2(Math.floor(((m%1440)+1440)%1440/60))+':'+pad2(Math.round(((m%1440)+1440)%1440%60));
const bedN=t=>(t+720)%1440;
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const sum=a=>a.reduce((x,y)=>x+y,0);
const avg=a=>a.length?sum(a)/a.length:null;
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function seeded(s){let h=hashStr(s)||1;return()=>{h=Math.imul(h^(h>>>15),2246822507)>>>0;h=Math.imul(h^(h>>>13),3266489909)>>>0;return((h^=h>>>16)>>>0)/4294967296}}
const N=v=>typeof v==='number'&&isFinite(v)?v:null;
const B=v=>typeof v==='boolean'?v:null;
const Str=(v,n)=>typeof v==='string'?v.slice(0,n||200):'';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
let tt=null;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3000)}

/* ================= Einstellungen ================= */
const LS='lifemaxx-v2',LSS='lifemaxx-settings-v2';
const DEF_S=()=>({goals:{study:60,studyWeek:300,sleep:480,steps:10000,sport:45,screen:180},
  morning:['Ohne Snooze aufstehen','Glas Wasser','Bett machen','Frühstück','Tag planen'],
  evening:['Tasche für morgen packen','Handy ab 22 Uhr weg','10 Minuten lesen','Top 3 für morgen notieren'],
  detox:null,detoxDone:[],diff:'adaptive',adapt:{},ach:[],keepAwake:true,wakeTarget:'06:45',mains:[],side:[],sugOff:0,updated:0});
let S=DEF_S();
function sNorm(o){const s=DEF_S();if(!o||typeof o!=='object')return s;
  if(o.goals)Object.keys(s.goals).forEach(k=>{const v=N(o.goals[k]);if(v!=null&&v>=0)s.goals[k]=v});
  ['morning','evening'].forEach(k=>{if(Array.isArray(o[k]))s[k]=o[k].filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim().slice(0,60)).slice(0,12)});
  if(o.detox&&o.detox.type&&o.detox.start)s.detox={type:String(o.detox.type),start:String(o.detox.start)};
  if(Array.isArray(o.detoxDone))s.detoxDone=o.detoxDone.slice(0,200);
  if(['easy','normal','hard','adaptive'].includes(o.diff))s.diff=o.diff;
  if(o.adapt&&typeof o.adapt==='object')s.adapt=o.adapt;
  if(Array.isArray(o.ach))s.ach=o.ach.slice(0,200);
  if(typeof o.keepAwake==='boolean')s.keepAwake=o.keepAwake;
  if(Array.isArray(o.mains))s.mains=o.mains.filter(m=>m&&typeof m.title==='string').slice(0,50).map(m=>({id:Str(m.id,40)||uid(),title:m.title.slice(0,100),why:Str(m.why,200),deadline:/^\d{4}-\d{2}-\d{2}$/.test(m.deadline)?m.deadline:'',daily:Str(m.daily,80),
    steps:Array.isArray(m.steps)?m.steps.filter(x=>x&&typeof x.t==='string').slice(0,40).map(x=>({id:Str(x.id,40)||uid(),t:x.t.slice(0,100),done:!!x.done,doneAt:/^\d{4}-\d{2}-\d{2}$/.test(x.doneAt)?x.doneAt:''})):[],
    log:(m.log&&typeof m.log==='object')?Object.fromEntries(Object.keys(m.log).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&m.log[k]===true).map(k=>[k,true])):{},
    status:['active','done','dropped'].includes(m.status)?m.status:'active',created:Str(m.created,10),doneAt:/^\d{4}-\d{2}-\d{2}$/.test(m.doneAt)?m.doneAt:''}));
  if(Array.isArray(o.side))s.side=o.side.filter(q=>q&&typeof q.t==='string').slice(0,200).map(q=>({id:Str(q.id,40)||uid(),t:q.t.slice(0,100),size:[1,2,3].includes(q.size)?q.size:1,deadline:/^\d{4}-\d{2}-\d{2}$/.test(q.deadline)?q.deadline:'',done:!!q.done,doneAt:/^\d{4}-\d{2}-\d{2}$/.test(q.doneAt)?q.doneAt:'',created:Str(q.created,10)}));
  s.sugOff=+o.sugOff||0;if(tmin(o.wakeTarget)!=null)s.wakeTarget=o.wakeTarget;
  s.updated=+o.updated||0;return s}
function sSave(){S.updated=Date.now();try{localStorage.setItem(LSS,JSON.stringify(S))}catch(e){}invalidate()}

/* ================= Tagesdaten ================= */
let days={};let cur=today();
function blank(){return{brain:{study:0,tasks:0,read:0,anki:0},focus:[],sport:{steps:null,rest:false,water:null},acts:[],feel:{mood:null,energy:null,day:null},journal:{line:'',grat:''},checkin:{am:false,pm:false},
  sleep:{bed:'',wake:'',min:null,score:null,rhr:null,bb:null,stress:null,src:''},
  digital:{screen:null,social:null,shorts:null,pickups:null,fmode:null,first:null,last:null},
  life:{goal:'',tasks:[],morning:{},evening:{},tidy:null,punctual:null,useful:0},
  games:{},gxp:0,workout:{},closed:false,note:'',updated:0}}
const EMPTY=blank();
function normActs(a){return Array.isArray(a)?a.filter(x=>x&&N(+x.min)!=null).slice(0,40).map(x=>({id:Str(x.id,80)||('a'+Math.random().toString(36).slice(2)),type:Str(x.type,30)||'Training',name:Str(x.name,80),min:Math.round(+x.min),km:N(+x.km)||0,src:Str(x.src,20)})):[]}
function normGames(o){const r={};if(o&&typeof o==='object')Object.keys(o).forEach(k=>{const g=o[k];if(g&&typeof g.v==='number'){r[k]={v:g.v,n:+g.n||1};if(g.df!=null)r[k].df=+g.df}});return r}
function fromV1(o){const d=blank();d.acts=normActs(o.acts);d.games=normGames(o.games);d.gxp=Math.min(1500,+o.xp||0);
  const m=o.metrics||{};d.sport.steps=N(m.steps);d.sleep.min=N(m.sleepMin);d.sleep.score=N(m.sleepScore);d.sleep.rhr=N(m.rhr);d.sleep.bb=N(m.bb);d.sleep.stress=N(m.stress);if(m.src)d.sleep.src=Str(m.src,30);
  d.note=Str(o.note,2000);d.updated=+o.updated||0;return d}
function norm(o){if(!o||typeof o!=='object')return blank();if(!o.brain&&(o.chips||o.scales||o.metrics))return fromV1(o);
  const d=blank();const b=o.brain||{};['study','tasks','read','anki'].forEach(k=>{const v=N(b[k]);if(v!=null&&v>=0)d.brain[k]=Math.round(v)});
  if(Array.isArray(o.focus))d.focus=o.focus.filter(x=>x&&N(x.min)!=null).slice(0,50).map(x=>({t:['lernen','deep','lesen'].includes(x.t)?x.t:'deep',min:Math.round(x.min),pf:!!x.pf,int:+x.int||0,at:+x.at||0}));
  const sp=o.sport||{};d.sport.steps=N(sp.steps);d.sport.rest=!!sp.rest;d.sport.water=N(sp.water);
  const fe=o.feel||{};['mood','energy','day'].forEach(k=>{const v=N(fe[k]);d.feel[k]=v!=null&&v>=1&&v<=5?v:null});
  const jo=o.journal||{};d.journal.line=Str(jo.line,280);d.journal.grat=Str(jo.grat,200);
  const ci=o.checkin||{};d.checkin.am=!!ci.am;d.checkin.pm=!!ci.pm;d.acts=normActs(o.acts);
  const sl=o.sleep||{};d.sleep.bed=tmin(sl.bed)!=null?sl.bed:'';d.sleep.wake=tmin(sl.wake)!=null?sl.wake:'';['min','score','rhr','bb','stress'].forEach(k=>d.sleep[k]=N(sl[k]));d.sleep.src=Str(sl.src,30);
  const dg=o.digital||{};['screen','social','shorts','pickups','fmode'].forEach(k=>d.digital[k]=N(dg[k]));d.digital.first=B(dg.first);d.digital.last=B(dg.last);
  const L=o.life||{};d.life.goal=Str(L.goal,120);
  if(Array.isArray(L.tasks))d.life.tasks=L.tasks.filter(t=>t&&typeof t.t==='string').slice(0,30).map(t=>({id:Str(t.id,40)||('t'+Math.random().toString(36).slice(2)),t:t.t.slice(0,100),p:[1,2,3].includes(t.p)?t.p:2,top:!!t.top,done:!!t.done}));
  ['morning','evening'].forEach(r=>{if(L[r]&&typeof L[r]==='object')Object.keys(L[r]).forEach(i=>{if(L[r][i]===true)d.life[r][i]=true})});
  d.life.tidy=B(L.tidy);d.life.punctual=B(L.punctual);d.life.useful=clamp(+L.useful||0,0,5);
  d.games=normGames(o.games);d.gxp=Math.min(1500,+o.gxp||0);
  if(o.workout&&typeof o.workout==='object')Object.keys(o.workout).forEach(k=>{if(typeof o.workout[k]==='number')d.workout[k]=o.workout[k]});
  d.closed=!!o.closed;d.note=Str(o.note,2000);d.updated=+o.updated||0;return d}
const get=k=>days[k]||EMPTY;
function ensure(k){if(!days[k])days[k]=blank();return days[k]}
function lsWrite(){try{localStorage.setItem(LS,JSON.stringify(days))}catch(e){toast('Speicher voll. Bitte ein Backup machen.')}}
function save(k){ensure(k).updated=Date.now();lsWrite();invalidate()}
function loadAll(){
  let raw=null;try{raw=localStorage.getItem(LS)}catch(e){}
  if(raw){try{const o=JSON.parse(raw);Object.keys(o).forEach(k=>{if(/^\d{4}-\d{2}-\d{2}$/.test(k))days[k]=norm(o[k])})}catch(e){}}
  else{try{const o=JSON.parse(localStorage.getItem('brainmaxx-log-v1')||'null');if(o)Object.keys(o).forEach(k=>{if(/^\d{4}-\d{2}-\d{2}$/.test(k))days[k]=norm(o[k])});if(Object.keys(days).length)lsWrite()}catch(e){}}
  try{const s=localStorage.getItem(LSS);if(s)S=sNorm(JSON.parse(s));else{const o=JSON.parse(localStorage.getItem('brainmaxx-settings-v1')||'null');if(o){S.diff=sNorm(o).diff;S.adapt=sNorm(o).adapt}}}catch(e){}
}
const hasAny=d=>d&&d!==EMPTY&&CATS.some(c=>catOf(c.id,d,null).has);
function bedBy(){const w=tmin(S.wakeTarget);return w==null?null:((w-S.goals.sleep-15)%1440+1440)%1440}

/* ================= Insights & Rückblick ================= */
function insights(){const ks=Object.keys(days).filter(k=>scores(k).n>=2);if(ks.length<7)return{few:true,n:ks.length};const out=[];
  const cmp=(grp,val,thr,text)=>{const A=[],Bv=[];ks.forEach(k=>{const d=get(k);const g=grp(d,k);if(g==null)return;const v=val(d,k);if(v==null)return;(g?A:Bv).push(v)});
    if(A.length<3||Bv.length<3)return;const a=avg(A),b=avg(Bv);if(Math.abs(a-b)<thr)return;out.push({w:Math.abs(a-b)/thr,t:text(a,b)})};
  const enough=d=>{const x=sleepDur(d);return x==null?null:x>=S.goals.sleep-15};
  const r1=v=>Math.round(v),r10=v=>(Math.round(v*10)/10).toString().replace('.',',');
  cmp(enough,(d,k)=>scores(k).total,4,(a,b)=>`Nach genug Schlaf ist dein Life Score im Schnitt <b>${r1(Math.abs(a-b))} Punkte ${a>b?'höher':'niedriger'}</b> (${r1(a)} statt ${r1(b)}).`);
  cmp(enough,d=>d.feel.energy,.4,(a,b)=>`Nach genug Schlaf liegt deine Energie bei <b>${r10(a)}</b> statt ${r10(b)} von 5.`);
  cmp(d=>d.acts.length>0,d=>d.feel.day,.4,(a,b)=>`An Sport-Tagen bewertest du den Tag mit <b>${r10(a)}</b> statt ${r10(b)} von 5.`);
  cmp(d=>d.acts.length>0,d=>d.brain.study||null,10,(a,b)=>`An Sport-Tagen lernst du im Schnitt <b>${r1(Math.abs(a-b))} Min ${a>b?'mehr':'weniger'}</b>.`);
  cmp(d=>d.digital.shorts==null?null:d.digital.shorts>30,d=>d.brain.study,10,(a,b)=>`An Tagen mit über 30 Min Short-Videos lernst du <b>${r1(Math.abs(a-b))} Min ${a>b?'mehr':'weniger'}</b>.`);
  cmp(d=>d.digital.first,(d,k)=>scores(k).total,4,(a,b)=>`Wenn die erste Stunde handyfrei ist, liegt dein Score bei <b>${r1(a)}</b> statt ${r1(b)}.`);
  cmp(d=>d.focus.length>0,d=>{const r=taskRate(d);return r==null?null:r*100},8,(a,b)=>`An Tagen mit Fokus-Session erledigst du <b>${r1(a)} %</b> deiner Aufgaben statt ${r1(b)} %.`);
  cmp(d=>{const b=tmin(d.sleep.bed);return b==null?null:bedN(b)<=660},d=>d.feel.energy,.4,(a,b)=>`Wenn du vor 23 Uhr im Bett warst, hast du morgens <b>${r10(a)}</b> statt ${r10(b)} Energie.`);
  cmp(d=>d.digital.screen==null?null:d.digital.screen>S.goals.screen,d=>d.feel.day,.4,(a,b)=>`An Tagen über deinem Bildschirm-Limit bewertest du den Tag mit <b>${r10(a)}</b> statt ${r10(b)}.`);
  out.sort((x,y)=>y.w-x.w);return{list:out.slice(0,4),n:ks.length}}
function weekCompare(){const t=today();const ws=weekStartKey(t);const thisK=weekDays(ws);const lastK=[...Array(7)].map((_,i)=>addDays(ws,i-7));
  const agg=ks=>{const r={total:[],cats:{}};CATS.forEach(c=>r.cats[c.id]=[]);ks.forEach(k=>{const s=scores(k);if(s.total!=null)r.total.push(s.total);CATS.forEach(c=>{if(s.c[c.id].has)r.cats[c.id].push(s.c[c.id].score)})});return r};
  return{a:agg(thisK),b:agg(lastK),days:thisK}}

/* ================= Scores ================= */
let SC=new Map(),XPC=null;
function invalidate(){SC.clear();XPC=null}
const CATS=[{id:'brain',name:'Lernen',w:.22,col:'#B9A3FF'},{id:'sport',name:'Sport',w:.2,col:'#9FCBAA'},{id:'sleep',name:'Schlaf',w:.22,col:'#7FA8FF'},{id:'digital',name:'Digital',w:.16,col:'#EA826F'},{id:'life',name:'Alltag',w:.2,col:'#F0A73C'}];
function sleepDur(d){const b=tmin(d.sleep.bed),w=tmin(d.sleep.wake);if(b!=null&&w!=null){const x=(w-b+1440)%1440;if(x>=60)return x}return d.sleep.min}
function sd(a){const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))}
function consistency(k){const b=[],w=[];for(let i=0;i<7;i++){const d=get(addDays(k,-i));const bt=tmin(d.sleep.bed),wt=tmin(d.sleep.wake);if(bt!=null)b.push(bedN(bt));if(wt!=null)w.push(wt)}
  const parts=[];if(b.length>=3)parts.push(sd(b));if(w.length>=3)parts.push(sd(w));if(!parts.length)return null;const s=avg(parts);
  return{score:Math.round(clamp(100-(s-15)*1.2,0,100)),sd:Math.round(s),n:Math.max(b.length,w.length)}}
function deepScore(d){const f=d.focus;const tot=sum(f.map(x=>x.min));if(!tot)return 0;const pf=sum(f.map(x=>x.pf?x.min:0))/tot;const lg=Math.max(...f.map(x=>x.min));const ints=sum(f.map(x=>x.int||0));
  return Math.round(clamp(Math.min(60,tot/120*60)+20*pf+Math.min(20,lg/50*20)-Math.min(15,ints*5),0,100))}
function gamePts(d){let s=0;Object.keys(d.games).forEach(k=>{if(typeof GAME!=='undefined'&&GAME[k])s+=GAME[k].pts(d.games[k].v)});return s}
const sportMin=d=>sum(d.acts.map(x=>+x.min||0));
const runKm=d=>sum(d.acts.filter(a=>a.type==='Lauf').map(a=>+a.km||0));
const tW=t=>t.p||2;
function taskRate(d){const t=d.life.tasks;if(!t.length)return null;return sum(t.filter(x=>x.done).map(tW))/sum(t.map(tW))}
function routineRate(d,which){const items=S[which];if(!items.length)return null;return items.filter(i=>d.life[which][i]).length/items.length}
function brainCat(d){const b=d.brain,g=S.goals;const deep=deepScore(d);const gp=gamePts(d);
  const has=b.study>0||b.tasks>0||b.read>0||b.anki>0||d.focus.length>0||Object.keys(d.games).length>0;
  const s=45*Math.min(1,b.study/Math.max(1,g.study))+15*Math.min(1,b.read/20)+10*Math.min(1,b.tasks/10)+10*Math.min(1,b.anki/50)+20*deep/100+10*Math.min(1,gp/6);
  return{has,score:Math.round(Math.min(100,s)),deep}}
function sportCat(d){const g=S.goals;const st=d.sport.steps;const w=d.sport.water;const has=st!=null||d.acts.length>0||d.sport.rest||w!=null;
  const sr=st?Math.min(1,st/Math.max(1,g.steps)):0;const mr=Math.min(1,sportMin(d)/Math.max(1,g.sport));const wr=w!=null?Math.min(1,w/8):null;
  let s=d.sport.rest&&!d.acts.length?35+65*sr:40*sr+45*mr+(d.acts.length?15:0);if(wr!=null)s=s*0.9+10*wr;return{has,score:Math.round(Math.min(100,s))}}
function sleepCat(d,k){const g=S.goals.sleep;const dur=sleepDur(d);const sc=d.sleep.score;const has=dur!=null||sc!=null;if(!has)return{has,score:0,dur:null};
  if(dur==null)return{has,score:sc,dur:null};
  const dp=dur>=g?55:55*Math.max(0,(dur-(g-180))/180);
  const bt=tmin(d.sleep.bed);const bp=bt==null?6:10*clamp((780-bedN(bt))/150,0,1);
  const c=k?consistency(k):null;const cp=c?25*c.score/100:15;
  const gp=sc!=null?10*sc/100:10*dp/55;
  return{has,score:Math.round(clamp(dp+bp+cp+gp,0,100)),dur,cons:c}}
function digitalCat(d){const x=d.digital,g=S.goals;const has=['screen','social','shorts','pickups','fmode'].some(k=>x[k]!=null)||x.first!=null||x.last!=null;if(!has)return{has,score:0};
  let s=80;if(x.screen!=null&&x.screen>g.screen)s-=Math.min(45,(x.screen-g.screen)/60*15);
  if(x.shorts!=null&&x.shorts>15)s-=Math.min(30,(x.shorts-15)/15*6);
  if(x.social!=null&&x.social>60)s-=Math.min(20,(x.social-60)/30*5);
  if(x.pickups!=null&&x.pickups>60)s-=Math.min(15,(x.pickups-60)/20*3);
  if(x.first===true)s+=10;else if(x.first===false)s-=5;
  if(x.last===true)s+=10;else if(x.last===false)s-=5;
  if(x.fmode!=null&&x.fmode>=60)s+=5;
  return{has,score:Math.round(clamp(s,0,100))}}
function lifeCat(d){const L=d.life;const tr=taskRate(d);const tops=L.tasks.filter(t=>t.top);const mr=routineRate(d,'morning'),er=routineRate(d,'evening');
  const has=L.tasks.length>0||Object.keys(L.morning).length>0||Object.keys(L.evening).length>0||L.tidy!=null||L.punctual!=null||L.useful>0;
  if(!has)return{has,score:0,rate:null};
  const s=(L.tasks.length?10:0)+30*(tr||0)+(tops.length?15*tops.filter(t=>t.done).length/tops.length:0)+12*(mr||0)+12*(er||0)+(L.tidy?6:0)+(L.punctual?5:0)+(L.useful?10*(L.useful-1)/4:0);
  return{has,score:Math.round(clamp(s,0,100)),rate:tr}}
function catOf(id,d,k){return id==='brain'?brainCat(d):id==='sport'?sportCat(d):id==='sleep'?sleepCat(d,k):id==='digital'?digitalCat(d):lifeCat(d)}
function scores(k){if(SC.has(k))return SC.get(k);const d=get(k);const c={};let sw=0,ss=0,n=0;
  CATS.forEach(x=>{c[x.id]=catOf(x.id,d,k);if(c[x.id].has){sw+=x.w;ss+=x.w*c[x.id].score;n++}});
  const r={c,n,total:n?Math.round(ss/sw):null};SC.set(k,r);return r}
function recovery(k){const d=get(k);const sc=scores(k).c.sleep;if(!sc.has&&d.sleep.bb==null)return null;let r=sc.has?sc.score:60;
  if(d.sleep.bb!=null)r=(r+d.sleep.bb)/2;
  const rh=[];for(let i=1;i<=14;i++){const x=get(addDays(k,-i)).sleep.rhr;if(x!=null)rh.push(x)}
  if(d.sleep.rhr!=null&&rh.length>=3){const a=avg(rh);if(d.sleep.rhr>a+5)r-=10;else if(d.sleep.rhr<a-2)r+=5}
  if(d.sleep.stress!=null&&d.sleep.stress>50)r-=5;
  const y=get(addDays(k,-1));if(sportMin(y)>=90&&!y.sport.rest)r-=8;if(y.sport.rest)r+=5;
  return Math.round(clamp(r,0,100))}

function tier(s){if(s>=90)return['Brainmaxxed','Lehrbuch-Tag. Screenshot machen.'];if(s>=75)return['Main Character','Starker Tag, ehrlich.'];if(s>=60)return['Solide','Gut. Da geht noch was.'];if(s>=40)return['NPC-Modus','Läuft so mittel.'];return['Energiesparmodus','Morgen ist ein neuer Tag.']}

function rankOf(k){const s=scores(k).total;if(s==null)return null;const all=Object.keys(days).map(x=>scores(x)).filter(x=>x.total!=null&&x.n>=2).map(x=>x.total);
  if(all.length<5)return{few:true,n:all.length};const better=all.filter(v=>v>s).length,worse=all.filter(v=>v<s).length;if(!better)return{best:true};const top=Math.max(1,Math.ceil((better+1)/all.length*100));if(top<=50)return{top};if(!worse)return{worst:true};return{beat:Math.round(worse/all.length*100)}}

function dayXP(k){const d=get(k);if(d===EMPTY)return 0;const b=d.brain;let x=0;
  x+=Math.min(240,Math.floor(b.study/15)*20)+Math.min(60,Math.floor(b.read/10)*10)+Math.min(50,b.tasks*5)+Math.min(50,Math.floor(b.anki/20)*10);
  d.focus.forEach(f=>{if(f.min>=20)x+=30+(f.pf?20:0)});
  x+=Math.min(75,Math.floor((d.sport.steps||0)/1000)*5);
  x+=Math.min(150,sum(d.acts.map(t=>20+Math.min(60,+t.min||0))));if(d.sport.rest&&!d.acts.length)x+=20;
  const dur=sleepDur(d);if(dur!=null&&dur>=S.goals.sleep)x+=60;const bt=tmin(d.sleep.bed);if(bt!=null&&bedN(bt)<=660)x+=20;
  const g=d.digital;if(g.first)x+=30;if(g.last)x+=30;if(g.screen!=null&&g.screen<=S.goals.screen)x+=40;if(g.shorts!=null&&g.shorts<=15)x+=30;
  const L=d.life;L.tasks.forEach(t=>{if(t.done)x+=10*tW(t)+(t.top?15:0)});if(routineRate(d,'morning')===1)x+=40;if(routineRate(d,'evening')===1)x+=40;if(L.tidy)x+=20;if(L.punctual)x+=15;if(L.useful>=4)x+=20;
  const q=dailyQuests(k).filter(q=>q.f(d)).length;x+=q*100+(q===3?150:0);
  if(d.checkin.am)x+=50;if(d.checkin.pm)x+=50;if((d.sport.water||0)>=8)x+=20;if(d.journal.line.trim())x+=20;if(d.feel.mood||d.feel.energy||d.feel.day)x+=10;
  x+=d.gxp;if(d.closed){const s=scores(k).total;if(s!=null)x+=s*3}
  x+=questXPOn(k);
  return Math.round(x)}

function lifeStats(){const ks=Object.keys(days);const st={study:0,focus:0,steps:0,km:0,train:0,tasks:0,closed:0,best:0,five:false,deep90:false,first:0,cons90:false,games:0,morning:0,logged:0,bestStreak:0,checkins:0,journal:0};
  ks.forEach(k=>{const d=get(k);const s=scores(k);if(s.n)st.logged++;st.study+=d.brain.study;st.focus+=d.focus.length;st.steps+=d.sport.steps||0;st.km+=runKm(d);st.train+=d.acts.length;st.tasks+=d.life.tasks.filter(t=>t.done).length;
    if(d.closed)st.closed++;if(s.total!=null&&s.n>=2)st.best=Math.max(st.best,s.total);if(s.n===5)st.five=true;if(deepScore(d)>=90)st.deep90=true;if(d.digital.first)st.first++;
    const c=s.c.sleep.cons;if(c&&c.n>=5&&c.score>=90)st.cons90=true;st.games+=sum(Object.values(d.games).map(g=>g.n||1));if(routineRate(d,'morning')===1)st.morning++;st.checkins+=(d.checkin.am?1:0)+(d.checkin.pm?1:0);if(d.journal.line.trim())st.journal++});
  st.mainDone=S.mains.filter(m=>m.status==='done').length;st.sideDone=S.side.filter(q=>q.done).length;st.lifeRun=bestRun(STREAKS[0].f);st.sleepRun=bestRun(STREAKS[3].f);st.level=lvlOf(totalXP());st.detox=S.detoxDone.length;return st}

    h+=`<div class="ex" id="ex" hidden></div>`;qz.innerHTML=h};

    const t=st.t;

      st.review.push({q:t.qtext||strip(t.q),your:your==null?'–':your,right,ex:t.ex||''});

    btns[i].classList.add(c.ok?'right':'wrong');if(!c.ok&&btns[okI])btns[okI].classList.add('right');result(!!c.ok,strip(c.label))};

}
function choicesFrom(correct,distract,fmt){const f=fmt||(x=>x);const set=[correct];distract.forEach(x=>{if(set.length<4&&!set.some(y=>String(y)===String(x)))set.push(x)});

function genSprint(n,cap){

  if(op==='+'){a=rnd(5,18*L);b=rnd(4,15*L);ans=a+b;const[t,u]=splitTU(b);ex=t&&u?`${a} + ${b} = ${a} + ${t} + ${u} = ${a+t} + ${u} = ${ans}`:`${a} + ${b} = ${ans}`}
  else if(op==='−'){a=rnd(12,22*L);b=rnd(3,a-1);ans=a-b;const[t,u]=splitTU(b);ex=t&&u?`${a} − ${b} = ${a} − ${t} − ${u} = ${a-t} − ${u} = ${ans}`:`${a} − ${b} = ${ans}`}
  else if(op==='×'){a=rnd(2,5+2*L);b=rnd(3,8+L);if(L>=5&&Math.random()<.4){a=rnd(11,25);b=rnd(3,9)}ans=a*b;const[t,u]=splitTU(a);ex=a>10&&u?`${a} × ${b} = ${t}×${b} + ${u}×${b} = ${t*b} + ${u*b} = ${ans}`:`${a} × ${b} = ${ans}`}
  else{b=rnd(2,7+L);ans=rnd(2,5+2*L);a=b*ans;ex=`${a} ÷ ${b} = ${ans}, denn ${b} × ${ans} = ${a}`}
  return{q:`<span class="prompt">${a} ${op} ${b}</span>`,qtext:`${a} ${op} ${b}`,type:'num',ans:String(ans),ex};
}

function genDeriv(n){
  const hard=n>=4;const e1=rnd(2,hard?4:3);const e2=rnd(1,e1-1);
  const nz=()=>{let v=0;while(!v)v=rnd(-5,5);return v};
  const a=hard?nz():rnd(1,5),b=nz(),c=rnd(-9,9);const x=rnd(hard?-3:-2,hard?3:2);
  const f=term(a,e1,true)+term(b,e2,false)+(c?term(c,0,false):'');
  const fp=term(a*e1,e1-1,true)+term(b*e2,e2-1,false);
  const ans=a*e1*Math.pow(x,e1-1)+b*e2*Math.pow(x,e2-1);
  return{q:`<span class="prompt sm">f(x) = ${f}</span><span class="prompt" style="font-size:clamp(30px,6vw,44px)">f′(${minus(x)}) = ?</span>`,qtext:`f(x) = ${f}, f′(${minus(x)})`,type:'num',ans:String(ans),minus:true,auto:false,

}

function playScramble(){
