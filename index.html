  const gw=screen(hud([['ZEIT','hudT',sec+'s'],['RICHTIG','hudN',0],['ÜBERSPRUNGEN','hudW',0]])+`<div class="slots" id="slots"></div><div class="tiles" id="tiles"></div><div class="row" style="justify-content:center"><button class="btn" data-a="back">⌫ Zurück</button><button class="btn" data-a="skip">Überspringen</button></div>`);
  const draw=cls=>{$('#slots').className='slots'+(cls?' '+cls:'');$('#slots').innerHTML=[...st.word].map((_,i)=>`<span>${st.used[i]!=null?st.tiles[st.used[i]]:''}</span>`).join('');
    $('#tiles').innerHTML=st.tiles.map((l,i)=>`<button data-t="${i}" class="${st.used.includes(i)?'used':''}">${l}</button>`).join('')};
  const next=()=>{const len=Math.min(10,5+Math.floor((st.n+off)/2));let pool=WORDS.filter(w=>w.length===len);if(!pool.length)pool=WORDS;st.word=pick(pool);
    let t;do{t=shuffle([...st.word])}while(t.join('')===st.word);st.tiles=t;st.used=[];st.lock=false;draw()};
  const check=()=>{const b=st.used.map(i=>st.tiles[i]).join('');const ok=b===st.word||(WSET.has(b)&&srt(b)===srt(st.word));st.lock=true;
    if(ok){st.n++;$('#hudN').textContent=st.n;draw('ok');later(next,350)}else{draw('no');later(()=>{st.used=[];st.lock=false;draw()},550)}};
  const use=i=>{if(st.lock||st.used.includes(i))return;st.used.push(i);draw();if(st.used.length===st.word.length)check()};
  const act=a=>{if(st.lock)return;if(a==='back'){st.used.pop();draw()}else if(a==='skip'){st.w++;st.missed.push(st.word);$('#hudW').textContent=st.w;st.lock=true;$('#slots').className='slots no';$('#slots').innerHTML=[...st.word].map(c=>`<span>${c}</span>`).join('');later(next,900)}};
  gw.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();if(b.dataset.t!=null)use(+b.dataset.t);else if(b.dataset.a)act(b.dataset.a)});
  onKeys(e=>{if(e.key==='Backspace'){e.preventDefault();act('back');return}const L=e.key.toUpperCase();if(/^[A-ZÄÖÜ]$/.test(L)){const i=st.tiles.findIndex((x,j)=>x===L&&!st.used.includes(j));if(i>=0){e.preventDefault();use(i)}}});
  next();timer(sec,()=>finish('scramble',st.n,`${st.w} übersprungen${st.missed.length?': '+st.missed.join(', '):''}. Tipp: Erst nach typischen Silben suchen, etwa SCH, EN, ER oder UNG.`));
}

let readOrder=[];
function playReading(){
  const wpms=[250,350,450,600];const def=[250,350,450][G.lvl];
  const gw=screen(`<p class="intro">Ein kurzer Text läuft Wort für Wort in der Mitte. Der <b style="color:var(--acc)">orange</b> Buchstabe ist der Fixpunkt, dort ruht dein Blick. Danach kommen drei Fragen.</p><div class="row" style="justify-content:center">${wpms.map(w=>`<button class="btn${w===def?' solid':''}" data-w="${w}">${w} WPM</button>`).join('')}</div><span class="qhint">WPM = Wörter pro Minute. Normales Lesen liegt bei etwa 200–250.</span>`);
  gw.addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(b)run(+b.dataset.w)});
  function run(wpm){
    if(!readOrder.length)readOrder=shuffle(TEXTS.map((_,i)=>i));const T=TEXTS[readOrder.pop()];
    const words=T.x.split(/\s+/);const base=60000/wpm;
    screen(hud([['TEMPO','',wpm+' WPM'],['WORT','h1','0/'+words.length]])+`<span class="lab">${esc(T.t)}</span><div class="rsvp"><span class="l" id="rl"></span><span class="c" id="rc"></span><span class="r" id="rr"></span></div>`);
    const orp=w=>{const n=w.replace(/[^\wäöüÄÖÜß]/g,'').length;return n<=1?0:n<=5?1:n<=9?2:n<=13?3:4};
    let i=0;
    const show=()=>{if(i>=words.length){later(ask,600);return}const w=words[i];const k=orp(w);$('#rl').textContent=w.slice(0,k);$('#rc').textContent=w[k]||'';$('#rr').textContent=w.slice(k+1);$('#h1').textContent=(i+1)+'/'+words.length;
      let d=base;if(/[.!?:]$/.test(w))d*=2.2;else if(/[,;]$/.test(w))d*=1.5;if(w.length>9)d*=1.25;i++;later(show,d)};
    later(show,900);
    const qs=T.q.map(([q,ok,bad])=>({q,ok,opts:shuffle([ok,...bad])}));let qi=0,right=0;const review=[];
    function ask(){if(qi>=qs.length){const eff=Math.round(wpm*right/3);finish('read',eff,`${wpm} WPM × ${right} von 3 richtig = ${eff} effektive WPM. Tipp: Lieber etwas langsamer mit 3 von 3 als schnell mit 1 von 3.`,{review});return}
      const Q=qs[qi];const g3=screen(hud([['FRAGE','',(qi+1)+'/3'],['RICHTIG','',right]])+`<div class="logic"><b>${esc(Q.q)}</b></div><div class="choices">${Q.opts.map((o,j)=>`<button class="ch" data-i="${j}"><small>${j+1}</small>${esc(o)}</button>`).join('')}</div>`);
      let done=false;const pickA=j=>{if(done)return;done=true;const ok=Q.opts[j]===Q.ok;const b=g3.querySelectorAll('.ch');b[j].classList.add(ok?'right':'wrong');if(!ok){b[Q.opts.indexOf(Q.ok)].classList.add('right');review.push({q:Q.q,your:Q.opts[j],right:Q.ok,ex:'So steht es im Text „'+T.t+'“.'})}else right++;qi++;later(ask,ok?600:1400)};
      g3.addEventListener('pointerdown',e=>{const b=e.target.closest('.ch');if(b){e.preventDefault();pickA(+b.dataset.i)}});
      onKeys(e=>{if(/^[1-4]$/.test(e.key)){e.preventDefault();pickA(+e.key-1)}})}
  }
}

function renderToday(){const k=cur,t=today(),d=get(k),sc=scores(k),tot=sc.total;

function miniBars(vals,ks,goal,fmt){const max=Math.max(goal*1.15,...vals.map(v=>v||0));const W=280,H=74,b=56;const sl=W/vals.length;let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Schlaf der letzten 7 Nächte">`;

  vals.forEach((v,i)=>{const x=i*sl+sl*.25,w=sl*.5;if(v){const h=v/max*(b-6);s+=`<rect x="${x.toFixed(1)}" y="${(b-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${v>=goal?'var(--good)':v>=goal-60?'var(--acc)':'var(--bad)'}"><title>${fmt(v)} h</title></rect>`}else s+=`<circle cx="${(x+w/2).toFixed(1)}" cy="${b-2}" r="1.5" fill="var(--faint)"/>`;
    s+=`<text x="${(x+w/2).toFixed(1)}" y="${b+13}" text-anchor="middle" font-size="9" font-family="Geist Mono, monospace" fill="var(--faint)">${WD[toDate(ks[i]).getDay()]}</text>`});
  return s+`<line x1="0" x2="${W}" y1="${b}" y2="${b}" stroke="var(--line2)"/></svg>`}

function renderSheet(top){const el=$('#sheet');const y=el.scrollTop;const k=cur,d=get(k);let h='';

  else if(SHEET.kind==='page'){const P=PAGES[SHEET.id];h=`<div class="shh"><span></span><b>${P.t}</b><span></span><button class="x" data-act="sheet-close" aria-label="Schließen">×</button></div><div class="shb">${P.f()}</div>`}

      <h3 class="cit">${st.t}</h3><div class="shb">${st.f(d,k)}</div>
      <div class="row cinav">${i?'<button class="btn" data-act="ci-back">Zurück</button>':''}<button class="btn accent big" data-act="ci-next">${i<C.steps.length-1?'Weiter':'Fertig'}</button></div>`}
  el.innerHTML=h;el.scrollTop=top?0:y}

function closeDaySheet(){const k=cur,d=get(k),sc=scores(k),tot=sc.total;if(tot==null){closeSheet();return}const[tn]=tier(tot);const rk=rankOf(k);
  const has=CATS.filter(c=>sc.c[c.id].has);const low=has.slice().sort((a,b)=>sc.c[a.id].score-sc.c[b.id].score)[0];const high=has.slice().sort((a,b)=>sc.c[b.id].score-sc.c[a.id].score)[0];
  const tips={brain:'Morgen eine Fokus-Session einplanen.',sport:'Morgen mehr bewegen, schon ein Spaziergang hilft.',sleep:'Heute früher ins Bett'+(bedBy()!=null?', spätestens '+fmtClock(bedBy()):'')+'.',digital:'Morgen die erste Stunde ohne Handy starten.',life:'Morgen früh deine Top 3 festlegen.'};

   <div class="sbars">${CATS.map(c=>{const x=sc.c[c.id];return`<div class="sbr"><span>${c.name}</span>${bar(x.has?x.score/100:0,x.has?zone(x.score):'')}<b>${x.has?x.score:'–'}</b></div>`}).join('')}</div>
   ${high?`<div class="note good">Stärkster Bereich: <b>${high.name}</b> (${sc.c[high.id].score})</div>`:''}

   ${d.journal.line?`<div class="note">„${esc(d.journal.line)}“</div>`:''}
   <div class="kvs">${kv('XP heute',nf(xp))}${kv('Life-Streak',streakOf(STREAKS[0].f)+' T.')}${kv('Quests',dailyQuests(k).filter(q=>q.f(d)).length+'/3')}</div>
   <div class="row">${d.closed?'<button class="btn solid" data-act="sheet-close">Schließen</button>':`<button class="btn accent big" data-act="close-confirm">Abschließen · +${tot*3} XP</button><button class="btn" data-act="sheet-close">Später</button>`}</div>`)}

/* ---------- Fokus-Timer ---------- */
const LSF='lifemaxx-focus';let FT=null,ftType='lernen',ftPlan=25,wakeLock=null,actx=null;
const FTYPES={lernen:'Lernen',deep:'Deep Work',lesen:'Lesen',pause:'Pause'};
function ftLoad(){try{FT=JSON.parse(localStorage.getItem(LSF)||'null')}catch(e){FT=null}}
function ftSave(){try{if(FT)localStorage.setItem(LSF,JSON.stringify(FT));else localStorage.removeItem(LSF)}catch(e){}}
function ftElapsed(){if(!FT)return 0;const now=FT.paused||Date.now();return Math.max(0,(now-FT.start-FT.pausedMs)/1000)}
function ftClock(){if(!FT)return'';const e=ftElapsed();const s=FT.plan?Math.max(0,FT.plan*60-e):e;return pad2(Math.floor(s/60))+':'+pad2(Math.floor(s%60))}
async function wakeOn(){if(!S.keepAwake||!navigator.wakeLock)return;try{wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function wakeOff(){try{if(wakeLock)wakeLock.release()}catch(e){}wakeLock=null}
function beep(){try{if(!actx)return;[0,.45].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.3)})}catch(e){}}
function ftStart(type,plan){FT={type:type||ftType,plan:plan==null?ftPlan:plan,start:Date.now(),paused:null,pausedMs:0,ints:0,pf:true,seen:Date.now()};ftSave();try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}wakeOn();render()}
function ftPause(){if(!FT)return;if(FT.paused){FT.pausedMs+=Date.now()-FT.paused;FT.paused=null;wakeOn()}else{FT.paused=Date.now();wakeOff()}ftSave();render()}
function ftFinish(silent){if(!FT)return;const e=ftElapsed();const min=FT.plan&&e>=FT.plan*60?FT.plan:Math.round(e/60);const k=keyOf(new Date(FT.start));const f=FT;FT=null;ftSave();wakeOff();
  if(f.type==='pause'){render();if(!silent){beep();openSheet(`<span class="lab">Pause vorbei</span><div class="tn">Bereit für die nächste Runde?</div><div class="row"><button class="btn accent big" data-act="ft-again">Nächste Runde · ${FTYPES[ftType]} ${ftPlan||25} min</button><button class="btn" data-act="sheet-close">Später</button></div>`)}return}
  if(min>=1){const d=ensure(k);d.focus.push({t:f.type,min,pf:f.pf,int:f.ints,at:f.start});if(f.type==='lernen')d.brain.study+=min;if(f.type==='lesen')d.brain.read+=min;commit(k);
    if(!silent){beep();openSheet(`<span class="lab">Session geschafft</span><div class="bignum" style="color:var(--good)">${min}<small style="font-size:.3em;color:var(--dim);margin-left:6px">min</small></div><div class="tn">${FTYPES[f.type]}${f.pf?' · handyfrei':''}</div><p class="hint">${f.type==='lernen'?'Zur Lernzeit addiert. ':f.type==='lesen'?'Zur Lesezeit addiert. ':''}${min>=20?'+'+(30+(f.pf?20:0))+' XP':'Ab 20 Minuten gibt es XP.'}${f.ints?` · ${f.ints} Unterbrechung${f.ints>1?'en':''}`:''}</p><div class="row"><button class="btn accent big" data-act="ft-break">5 Min Pause</button><button class="btn" data-act="sheet-close">Fertig</button></div>`)}}
  else{toast('Unter einer Minute, nicht gespeichert.');render()}}
function ftCheckReturn(){if(!FT||FT.paused)return;const gap=Date.now()-(FT.seen||Date.now());FT.seen=Date.now();ftSave();
  if(gap>8000&&FT.type!=='pause'){openSheet(`<span class="lab">Willkommen zurück</span><div class="tn">Du warst ${Math.max(1,Math.round(gap/60000))} Min weg.</div><p class="hint">Warst du in der Zeit am Handy, oder war es nur gesperrt?</p><div class="row"><button class="btn solid" data-act="ft-locked">Nur gesperrt</button><button class="btn" data-act="ft-used">War am Handy</button></div>`);return true}
  if(FT.plan&&ftElapsed()>=FT.plan*60)ftFinish()}
function ftTick(){if(!FT)return;if(!FT.paused&&!document.hidden){FT.seen=Date.now();if(Date.now()%5000<1000)ftSave()}
  const el=$('#ftTime');if(el)el.textContent=ftClock();const p=$('#ftProg');if(p&&FT.plan)p.style.width=Math.min(100,ftElapsed()/(FT.plan*60)*100)+'%';
  const ch=$('#ftChip');if(ch){ch.hidden=false;ch.textContent=(FT.type==='pause'?'☕ ':'◷ ')+ftClock()}
  if(!FT.paused&&FT.plan&&ftElapsed()>=FT.plan*60&&$('#modal').hidden)ftFinish()}
function renderFocus(){const t=today(),d=get(t);const f=d.focus;const fm=sum(f.map(x=>x.min));const plan=workoutPlan(t);const done=Object.keys(d.workout).length;
  let h=`<div class="ftbox">`;
  if(FT){h+=`<span class="lab">${FTYPES[FT.type]}${FT.plan?' · '+FT.plan+' min':' · freie Zeit'}${FT.paused?' · pausiert':''}</span><div class="fttime${FT.type==='pause'?' brk':''}" id="ftTime">${ftClock()}</div>${FT.plan?`<div class="pb"><i id="ftProg" style="width:${Math.min(100,ftElapsed()/(FT.plan*60)*100)}%"></i></div>`:''}
    <p class="hint">${FT.type==='pause'?'Aufstehen, Wasser trinken, aus dem Fenster schauen. Nicht aufs Handy.':'Handy weglegen. Wenn du die App verlässt, frage ich danach, ob du am Handy warst.'}${FT.ints?` · ${FT.ints}× unterbrochen`:''}</p>
    <div class="row c">${FT.type==='pause'?'<button class="btn solid big" data-act="ft-stop">Pause beenden</button>':`<button class="btn solid big" data-act="ft-pause">${FT.paused?'Weiter':'Pause'}</button><button class="btn big" data-act="ft-stop">Beenden & speichern</button>`}</div>${FT.type==='pause'?'':'<button class="lnk" data-act="ft-cancel">Verwerfen</button>'}`}
  else{h+=`<div class="fttime idle">${ftPlan?pad2(ftPlan)+':00':'∞'}</div>
    <div class="seg wide">${['lernen','deep','lesen'].map(t=>`<button type="button" data-ftype="${t}" aria-pressed="${ftType===t}">${FTYPES[t]}</button>`).join('')}</div>
    <div class="seg wide">${[25,50,90,0].map(m=>`<button type="button" data-fdur="${m}" aria-pressed="${ftPlan===m}">${m?m+' min':'Frei'}</button>`).join('')}</div>
    <button class="btn accent big wide" data-act="ft-start">Start</button><button class="tog sm" data-act="awake" aria-pressed="${S.keepAwake}">Bildschirm anlassen</button>`}
  h+=`</div><div class="kvs">${kv('Deep Work',deepScore(d))}${kv('Fokus heute',fmtDur(fm))}${kv('Handyfrei',fm?Math.round(sum(f.map(x=>x.pf?x.min:0))/fm*100)+' %':'–')}</div>`;
  if(f.length)h+=`<div class="acts">${f.map((x,i)=>`<div class="act"><span class="ty">${FTYPES[x.t]}</span><span class="nm">${new Date(x.at||Date.now()).toTimeString().slice(0,5)}${x.pf?' · handyfrei':' · mit Handy'}</span><span class="num">${x.min} min</span><button class="x" data-fdel="${i}" aria-label="Session löschen">×</button></div>`).join('')}</div>`;
  h+=sec('Brain-Workout',`<div class="workout">${plan.map((s,i)=>`<button class="wrow${d.workout[i]!=null?' done':''}" data-g="${s.id}" data-slot="${i}"><span class="wl">${s.lab}</span><span class="wn">${GAME[s.id].name}</span><span class="wx">${d.workout[i]!=null?'✓':s.dur}</span></button>`).join('')}</div>
    ${done<5?`<button class="btn accent wide" data-act="workout">${done?'Weiter mit Spiel '+(plan.findIndex((s,j)=>d.workout[j]==null)+1)+'/5':'Workout starten · 10 Min'}</button>`:'<div class="note good">Workout für heute geschafft.</div>'}`,`<span class="val">${done}/5</span>`);
  h+=`<div class="menu">${menuRow('games','Alle Brain-Spiele',GAMES.length)}${menuRow('fman','Session ohne Timer nachtragen')}</div>`;
  $('#v-focus').innerHTML=h}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(FT&&!FT.paused){FT.seen=Date.now();ftSave()}}else{if(FT){ftCheckReturn();if(S.keepAwake&&FT&&!FT.paused)wakeOn()}}});

function renderQuests(){const t=today(),d=get(t);const qs=dailyQuests(t);const qd=qs.filter(q=>q.f(d)).length;const wq=weeklyQuests(weekStartKey());const dt=detoxState(S.detox);
  const open=S.side.filter(q=>!q.done);const doneN=S.side.length-open.length;const m=activeMain();const past=S.mains.filter(x=>x.status!=='active').length;
  let h='';

  vals.forEach((v,i)=>{const x=i*sl+sl*.22,w=sl*.56,cx=(x+w/2).toFixed(1);if(v!=null&&v>0){const h=(v/max)*(b-top);s+=`<rect x="${x.toFixed(1)}" y="${(b-h).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1.5,h).toFixed(1)}" rx="1.5" fill="${o.colorFn?o.colorFn(v):o.color}" fill-opacity="${i===vals.length-1?1:.8}"><title>${labels[i]}: ${o.fmt(v)}</title></rect><text x="${cx}" y="${(b-h-4).toFixed(1)}" text-anchor="middle" font-size="8.5" font-family="Geist Mono, monospace" fill="var(--dim)">${o.fmt(v)}</text>`}else s+=`<circle cx="${cx}" cy="${b-3}" r="1.5" fill="var(--faint)"/>`;

  if((el=T.closest('[data-mq]'))){mainAction(el.dataset.mq,el.dataset.sid);return}
  if((el=T.closest('[data-sq]'))){const q=S.side.find(x=>x.id===el.dataset.qid);if(!q)return;const a=el.dataset.sq;
    if(a==='done'){q.done=!q.done;q.doneAt=q.done?today():'';if(q.done)toast('Side Quest erledigt · +'+SIDE_XP[q.size]+' XP')}else if(a==='size')q.size=q.size%3+1;else if(a==='del')S.side=S.side.filter(x=>x!==q);qCommit();return}
  if((el=T.closest('[data-sugg]'))){const sg=sideSuggestions()[+el.dataset.sugg];if(!sg)return;S.side.push({id:uid(),t:sg[0],size:sg[1],deadline:'',done:false,doneAt:'',created:today()});qCommit();toast('Side Quest angenommen.');return}
  if((el=T.closest('[data-page]'))){openPage(el.dataset.page);return}
  if((el=T.closest('#modal'))&&T===el){if(SHEET&&SHEET.kind==='ci')return;closeSheet();render();return}
  if((el=T.closest('[data-step]'))){const p=el.dataset.step;const d=ensure(cur);const v=getP(d,p);const nv=clamp((v||0)+(+el.dataset.d),0,LIMITS[p]||100000);setP(d,p,nv);commit();return}
  if((el=T.closest('[data-tog]'))){const p=el.dataset.tog;const d=ensure(cur);const val=el.dataset.v==='1';setP(d,p,getP(d,p)===val?null:val);commit();return}
  if((el=T.closest('[data-feel]'))){const d=ensure(cur);const k2=el.dataset.feel,v=+el.dataset.v;d.feel[k2]=d.feel[k2]===v?null:v;commit();return}
  if((el=T.closest('[data-cat]'))){openCat(el.dataset.cat);return}
  if((el=T.closest('[data-rt]'))){const d=ensure(cur);const w=el.dataset.rt;const it=S[w][+el.dataset.ri];if(d.life[w][it])delete d.life[w][it];else d.life[w][it]=true;commit();return}
  if((el=T.closest('[data-ta]'))){const d=ensure(cur);const t=d.life.tasks.find(x=>x.id===el.dataset.tid);if(!t)return;const a=el.dataset.ta;
    if(a==='done')t.done=!t.done;else if(a==='prio')t.p=t.p%3+1;else if(a==='del')d.life.tasks=d.life.tasks.filter(x=>x!==t);else if(a==='top'){if(!t.top&&d.life.tasks.filter(x=>x.top).length>=3){toast('Maximal 3 Top-Aufgaben.');return}t.top=!t.top}commit();return}
  if((el=T.closest('[data-useful]'))){const d=ensure(cur);const v=+el.dataset.useful;d.life.useful=d.life.useful===v?0:v;commit();return}
  if((el=T.closest('[data-adel]'))){const d=ensure(cur);d.acts.splice(+el.dataset.adel,1);commit();return}
  if((el=T.closest('[data-fdel]'))){const k=today();const d=ensure(k);const f=d.focus[+el.dataset.fdel];if(!f)return;if(f.t==='lernen')d.brain.study=Math.max(0,d.brain.study-f.min);if(f.t==='lesen')d.brain.read=Math.max(0,d.brain.read-f.min);d.focus.splice(+el.dataset.fdel,1);commit(k);return}
  if((el=T.closest('[data-ftype]'))){ftType=el.dataset.ftype;render();return}
  if((el=T.closest('[data-fdur]'))){ftPlan=+el.dataset.fdur;render();return}
  if((el=T.closest('[data-chart]'))){chartSel=el.dataset.chart;render();return}
  if((el=T.closest('[data-cal]'))){cur=el.dataset.cal;setTab('today');return}
  if((el=T.closest('[data-diff]'))){S.diff=el.dataset.diff;sSave();render();return}
  if((el=T.closest('[data-f]'))){gFilter=el.dataset.f;render();return}
  if((el=T.closest('[data-g]'))){closeSheet();const s=el.dataset.slot;if(s!=null&&get(today()).workout[s]==null){const p=workoutPlan(today())[+s];openGame(p.id,{slot:+s,sec:p.sec})}else openGame(el.dataset.g);return}
  if((el=T.closest('[data-tab]'))){closeSheet();setTab(el.dataset.tab);return}
  if(!(el=T.closest('[data-act]')))return;const a=el.dataset.act;const t=today();
  if(a==='prev'){cur=addDays(cur,-1);render()}
  else if(a==='next'){if(cur<t){cur=addDays(cur,1);render()}}
  else if(a==='close')closeDaySheet();
  else if(a==='close-confirm'){ensure(cur).closed=true;commit();closeDaySheet();toast('Tag abgeschlossen. Gute Nacht.')}
  else if(a==='sheet-close'){closeSheet();render()}
  else if(a==='ci-am'||a==='ci-pm')openCheckin(a.slice(3));
  else if(a==='ci-next'){const C=CI[SHEET.type];if(SHEET.step<C.steps.length-1){SHEET.step++;renderSheet(true)}else{const d=ensure(cur);d.checkin[SHEET.type]=true;const ty=SHEET.type;SHEET=null;commit();if(ty==='pm')closeDaySheet();else{closeSheet();toast('Morgen-Check-in erledigt · +50 XP')}}}
  else if(a==='ci-back'){if(SHEET.step>0){SHEET.step--;renderSheet(true)}}
  else if(a==='gofocus'){closeSheet();setTab('focus')}
  else if(a==='gogames'){closeSheet();setTab('games')}
  else if(a==='workout')startWorkout();
  else if(a==='rest'){const d=ensure(cur);d.sport.rest=!d.sport.rest;commit()}
  else if(a==='carry'){const d=ensure(cur);get(addDays(cur,-1)).life.tasks.filter(x=>!x.done&&!d.life.tasks.some(y=>y.t===x.t)).forEach(x=>d.life.tasks.push({id:'t'+Math.random().toString(36).slice(2,9),t:x.t,p:x.p,top:x.top,done:false}));commit()}
  else if(a==='detox-start'){S.detox={type:$('#detoxSel').value,start:t};sSave();render();toast('Challenge gestartet. 7 Tage, los geht’s.')}
  else if(a==='detox-stop'){S.detox=null;sSave();render()}
  else if(a==='ft-start')ftStart();
  else if(a==='ft-pause')ftPause();
  else if(a==='ft-stop')ftFinish();
  else if(a==='ft-break'){closeSheet();ftStart('pause',5);setTab('focus')}
  else if(a==='ft-again'){closeSheet();ftStart(ftType,ftPlan||25);setTab('focus')}
  else if(a==='ft-cancel'){FT=null;ftSave();wakeOff();render();toast('Session verworfen.')}
  else if(a==='ft-locked'){closeSheet();if(FT&&FT.plan&&ftElapsed()>=FT.plan*60)ftFinish();else render()}
  else if(a==='ft-used'){if(FT){FT.ints++;FT.pf=false;ftSave()}closeSheet();if(FT&&FT.plan&&ftElapsed()>=FT.plan*60)ftFinish();else render()}
  else if(a==='awake'){S.keepAwake=!S.keepAwake;sSave();render()}
  else if(a==='mprev'){monthOff--;render()}
  else if(a==='mnext'){if(monthOff<0){monthOff++;render()}}
  else if(a==='import'||a==='bk-load')$('#file').click();
  else if(a==='bk-save')saveBackup();
  else if(a==='sugg'){S.sugOff++;sSave();render()}
});
$('#stQuit').addEventListener('click',closeStage);

/* ================= Import & Backup ================= */
async function importFiles(files){const imgs=files.filter(f=>/^image\//.test(f.type));if(imgs.length&&imgs.length===files.length){toast('Screenshots kann die App nicht auslesen. Bitte Datei-Export nutzen.');return}
  toast('Lese '+files.length+' Datei'+(files.length>1?'en':'')+' …');const res={acts:[],metrics:[],zips:0,errors:0,skipped:0};
  for(const f of files){if(/^image\//.test(f.type))continue;try{await handleEntry(f.name,()=>f.arrayBuffer(),res,0)}catch(e){res.errors++}}
  applyImport(res)}
function restoreBackup(o){let n=0;if(o.days&&typeof o.days==='object')Object.keys(o.days).forEach(k=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return;const inc=norm(o.days[k]);const loc=days[k];if(!loc||(+inc.updated||0)>(+loc.updated||0)){days[k]=inc;n++}});
  if(o.settings){if(o.brainmaxxBackup===2){const s=sNorm(o.settings);if(s.updated>S.updated){S=s}}else{const s=sNorm(o.settings);S.diff=s.diff;S.adapt=s.adapt}}
  lsWrite();sSave();return n}
function applyImport(res){const out=$('#impRes');const msg=m=>{toast(m);if(out)out.textContent=m};
  if(res.backup){const n=restoreBackup(res.backup);render();msg(`Backup geladen: ${n} Tag${n===1?'':'e'} übernommen.`);if(!res.acts.length&&!res.metrics.length)return}
  const t=today(),from=addDays(t,-120);const touched=new Set();let nA=0,nS=0,nB=0;
  res.acts.forEach(a=>{if(!(a.min>0)||isNaN(a.start))return;const k=keyOf(a.start);if(k>t||k<from)return;const type=normType(a.type);const st=new Date(a.start);st.setSeconds(0,0);const id=st.toISOString()+'|'+Math.round(a.min);const d=ensure(k);
    if(d.acts.some(x=>x.id===id||(Math.abs(new Date(String(x.id).split('|')[0])-st)<=120000&&Math.abs(x.min-a.min)<=2)))return;
    d.acts.push({id,type,name:(a.name||'').slice(0,80),min:Math.round(a.min),km:a.km?Math.round(a.km*100)/100:0,src:a.src});d.sport.rest=false;nA++;touched.add(k)});
  res.metrics.forEach(m=>{const k=m.date;if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||k>t||k<from)return;const d=ensure(k);let any=false;
    if(m.sleepScore!=null){d.sleep.score=m.sleepScore;any=true}if(m.sleepMin!=null){d.sleep.min=m.sleepMin;any=true}['rhr','bb','stress'].forEach(x=>{if(m[x]!=null){d.sleep[x]=m[x];any=true}});
    if(m.steps!=null){d.sport.steps=m.steps;any=true}if(!any)return;d.sleep.src=m.src||'Import';if(m.sleepScore!=null||m.sleepMin!=null)nS++;else nB++;touched.add(k)});
  touched.forEach(k=>ensure(k).updated=Date.now());lsWrite();invalidate();render();checkAch();
  const p=[];if(nA)p.push(nA+' Training'+(nA>1?'s':''));if(nS)p.push(nS+' Schlafnacht'+(nS>1?'e':''));if(nB)p.push(nB+' Tag'+(nB>1?'e':'')+' Körperdaten');
  if(p.length)msg('Importiert: '+p.join(' · ')+'.');else if(!res.backup)msg(res.acts.length||res.metrics.length?'Nichts Neues gefunden.':res.errors?'Datei konnte nicht gelesen werden. Erwartet: FIT, GPX, TCX, CSV, JSON oder ZIP.':'Keine Trainings oder Schlafdaten erkannt.')}
function backupJSON(){return JSON.stringify({brainmaxxBackup:2,app:'lifemaxx',exported:new Date().toISOString(),days,settings:S})}
async function saveBackup(){const name='lifemaxx-backup-'+today()+'.json';const json=backupJSON();
  try{const file=new File([json],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Lifemaxx Backup'});toast('Backup bereit. In „Dateien“ sichern.');return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('Backup gespeichert.')}

let startTab='today';try{startTab=localStorage.getItem('lifemaxx-tab')||'today'}catch(e){}
const hs=location.hash.replace('#','');if(TABS.includes(hs))startTab=hs;
setTab(startTab);checkDetox();checkAch();

setInterval(ftTick,1000);
let lastDay=today();setInterval(()=>{const t=today();if(t!==lastDay){if(cur===lastDay)cur=t;lastDay=t;invalidate();render()}},30000);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});

})();
